# Device Log Job defaults. Kubernetes injects candidate-specific overrides.
kafka.brokers=kafka-bootstrap.middleware.svc:9092
kafka.input.topic=device.logs.v1
kafka.group.id=flink-log-job
kafka.dlq.topic=dlq.v1
kafka.starting.offsets=committed-or-earliest
kafka.dlq.transactional.id.prefix=flink-log-job-dlq-v1
kafka.audit.topic=audit.logs
kafka.quality.transactional.id.prefix=flink-log-job-quality-v1
kafka.transaction.timeout.ms=600000

deployment.activation.mode=legacy
deployment.candidate.sha256=
projection.writes.enabled=true
source.fact.writes.enabled=false
clickhouse.url=jdbc:clickhouse://clickhouse-1.middleware.svc:8123/traffic
clickhouse.source.fact.table=traffic.source_device_log_facts_v1
clickhouse.user=default
clickhouse.password=
clickhouse.batch.size=1000
clickhouse.max.retries=3

checkpoint.path=s3://flink-checkpoints/checkpoints/log-job
checkpoint.interval.ms=30000
checkpoint.timeout.ms=300000
checkpoint.min.pause.ms=5000

watermark.delay.ms=10000
watermark.idleness.ms=60000
allowed.lateness.ms=30000
event.max.future.skew.ms=300000
event.max.clock.rollback.ms=30000

parallelism=4
restart.attempts=10
restart.delay.seconds=30
