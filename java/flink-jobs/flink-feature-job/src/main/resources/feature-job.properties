# Feature Job 生产环境配置 — 集群模式
kafka.brokers=kafka-bootstrap.middleware.svc:9092
kafka.topic.flow=flow.events.v1
kafka.topic.session=session.events.v1
kafka.topic.feature=feature.stat.v1
kafka.group.id=flink-feature-job
deployment.activation.mode=legacy
deployment.candidate.sha256=
kafka.input.topic=session.events.v1
kafka.output.topic=feature.stat.v1
kafka.dlq.topic=dlq.v1
l2.trigger.enabled=false
kafka.l2.trigger.topic=
kafka.starting.offsets=committed-or-earliest

# ClickHouse 集群端点
clickhouse.url=clickhouse-1.middleware.svc:8123,clickhouse-2.middleware.svc:8123
clickhouse.database=traffic
clickhouse.table=feature_stat
clickhouse.sequence.table=feature_seq
clickhouse.fingerprint.table=feature_fp
clickhouse.user=default
clickhouse.password=

# PostgreSQL 集群 (Primary + Replica)
postgres.url=jdbc:postgresql://postgres-primary.databases.svc:5432/traffic_platform
postgres.user=postgres
postgres.password=${POSTGRES_PASSWORD}

# Checkpoint
checkpoint.interval.ms=60000
checkpoint.timeout.ms=600000
restart.attempts=10
restart.delay.seconds=30

# Parallelism
parallelism=4
# state.ttl.hours 已移除：feature-job 无 keyed state，该配置无消费方（误导性声明）
watermark.delay.seconds=10
allowed.lateness.ms=0
