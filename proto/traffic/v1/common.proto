// =============================================================================
// FILE: proto/traffic/v1/common.proto
// =============================================================================

syntax = "proto3";

package traffic.v1;

option go_package = "github.com/1144160159/traffic-analysis-platform/go/control-plane/pkg/proto/traffic/v1;trafficv1";
option java_package = "com.traffic.proto.traffic.v1";
option java_multiple_files = true;

// EventHeader 事件头（所有事件的公共字段）
message EventHeader {
  string event_id = 1;
  string tenant_id = 2;
  string run_id = 3;
  int64 event_ts = 4;
  int64 ingest_ts = 5;
  string probe_id = 6;
  string feature_set_id = 7;
  // kafka_ts is the millisecond timestamp assigned immediately before the event is published to Kafka.
  int64 kafka_ts = 8;
  // flink_out_ts is the millisecond timestamp assigned when a Flink job emits or persists the derived event.
  int64 flink_out_ts = 9;
  // The fields below are an additive v1 event envelope. Existing fields remain
  // wire-compatible while producers migrate to the complete contract.
  string event_type = 10;
  string schema_version = 11;
  string aggregate_type = 12;
  string aggregate_id = 13;
  uint64 aggregate_version = 14;
  int64 occurred_at = 15;
  int64 produced_at = 16;
  string trace_id = 17;
  string causation_id = 18;
  string correlation_id = 19;
  string idempotency_key = 20;
  string producer = 21;
}

// FiveTuple 五元组
message FiveTuple {
  string src_ip = 1;
  string dst_ip = 2;
  uint32 src_port = 3;
  uint32 dst_port = 4;
  uint32 protocol = 5;
}

// PacketLengthStats 包长度统计
message PacketLengthStats {
  uint32 min = 1;
  uint32 max = 2;
  float mean = 3;
  float std = 4;
}

// InterArrivalStats 到达间隔统计
message InterArrivalStats {
  float min_ms = 1;
  float max_ms = 2;
  float mean_ms = 3;
  float std_ms = 4;
}

// ActiveIdleStats Active/Idle 时间统计
message ActiveIdleStats {
  float min_ms = 1;
  float mean_ms = 2;
  float max_ms = 3;
  float std_ms = 4;
}

// TransportSecurityProtocol names only a positively observed wire protocol.
// Port numbers alone MUST NOT set this value or imply malicious traffic.
enum TransportSecurityProtocol {
  TRANSPORT_SECURITY_PROTOCOL_UNSPECIFIED = 0;
  TRANSPORT_SECURITY_PROTOCOL_TLS = 1;
  TRANSPORT_SECURITY_PROTOCOL_QUIC = 2;
}

// TrafficFeatureObservation is a bounded, additive carrier from packet capture
// through sessionization to feature projection. It contains no raw payload:
// byte histograms and hashes are sufficient for deterministic statistics while
// raw_traffic_ref, when present, points to separately governed PCAP evidence.
message TrafficFeatureObservation {
  string schema_version = 1;
  string algorithm_version = 2;
  repeated sint32 signed_packet_lengths = 3;
  repeated int64 packet_event_time_us = 4;
  // Sixteen nibble buckets (0x0..0xf), bounded independently of flow size.
  repeated uint64 payload_nibble_counts = 5;
  uint64 payload_observed_bytes = 6;
  bool sequence_truncated = 7;
  TransportSecurityProtocol transport_security = 8;
  string tls_version = 9;
  string ja3 = 10;
  string ja4 = 11;
  string sni = 12;
  string cert_sha256 = 13;
  bool cert_is_self_signed = 14;
  bool cert_is_self_signed_known = 15;
  uint32 pubkey_len = 16;
  bool pubkey_len_known = 17;
  string quic_version = 18;
  string raw_traffic_ref = 19;
  repeated string missing_fields = 20;
}

// FlowDirection 流方向
enum FlowDirection {
  FLOW_DIRECTION_UNSPECIFIED = 0;
  FLOW_DIRECTION_FORWARD = 1;
  FLOW_DIRECTION_BACKWARD = 2;
  FLOW_DIRECTION_BIDIRECTIONAL = 3;
}

// Severity 严重程度
enum Severity {
  SEVERITY_UNSPECIFIED = 0;
  SEVERITY_INFO = 1;
  SEVERITY_LOW = 2;
  SEVERITY_MEDIUM = 3;
  SEVERITY_HIGH = 4;
  SEVERITY_CRITICAL = 5;
}

// AlertStatus 告警状态
enum AlertStatus {
  ALERT_STATUS_UNSPECIFIED = 0;
  ALERT_STATUS_NEW = 1;
  ALERT_STATUS_TRIAGE = 2;
  ALERT_STATUS_ASSIGNED = 3;
  ALERT_STATUS_IN_PROGRESS = 4;
  ALERT_STATUS_RESOLVED = 5;
  ALERT_STATUS_CLOSED = 6;
  ALERT_STATUS_FALSE_POSITIVE = 7;
}

// DeploymentStatus 部署状态
enum DeploymentStatus {
  DEPLOYMENT_STATUS_UNSPECIFIED = 0;
  DEPLOYMENT_STATUS_PLANNED = 1;
  DEPLOYMENT_STATUS_GRAY = 2;
  DEPLOYMENT_STATUS_ACTIVE = 3;
  DEPLOYMENT_STATUS_PAUSED = 4;
  DEPLOYMENT_STATUS_ROLLED_BACK = 5;
}

// TaskType 任务类型
enum TaskType {
  TASK_TYPE_UNSPECIFIED = 0;
  TASK_TYPE_REPLAY = 1;
  TASK_TYPE_TRAIN = 2;
  TASK_TYPE_EVAL = 3;
  TASK_TYPE_PCAP_CUT = 4;
}

// TaskStatus 任务状态
enum TaskStatus {
  TASK_STATUS_UNSPECIFIED = 0;
  TASK_STATUS_QUEUED = 1;
  TASK_STATUS_RUNNING = 2;
  TASK_STATUS_SUCCEEDED = 3;
  TASK_STATUS_FAILED = 4;
  TASK_STATUS_CANCELED = 5;
}
