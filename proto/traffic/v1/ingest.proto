// FILE: proto/traffic/v1/ingest.proto
// =============================================================================

syntax = "proto3";

package traffic.v1;

import "traffic/v1/flow.proto";
import "traffic/v1/session.proto";
import "traffic/v1/pcap.proto";
import "traffic/v1/asset.proto";

option go_package = "github.com/1144160159/traffic-analysis-platform/go/control-plane/pkg/proto/traffic/v1;trafficv1";
option java_package = "com.traffic.proto.traffic.v1";
option java_multiple_files = true;

// ==================== IngestService 定义 ====================

service IngestService {
  // 批量上报 Flow 事件
  rpc UploadFlows(UploadFlowsRequest) returns (UploadFlowsResponse);

  // 流式上报 Flow 事件（双向流）
  rpc StreamFlows(stream StreamFlowsRequest) returns (stream StreamFlowsResponse);

  // 批量上报 Session 事件
  rpc UploadSessions(UploadSessionsRequest) returns (UploadSessionsResponse);

  // 上报 PCAP 索引元数据
  rpc UploadPcapIndex(UploadPcapIndexRequest) returns (UploadPcapIndexResponse);

  // Upload passive ARP/DHCP observations through the authenticated probe
  // channel. The Gateway owns Kafka credentials and returns broker-scoped
  // exact item results; probes never publish asset.bindings.v1 directly.
  rpc UploadAssetBindings(UploadAssetBindingsRequest) returns (UploadAssetBindingsResponse);

  // 探针心跳与配置同步
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);

  // 探针注册
  rpc RegisterProbe(RegisterProbeRequest) returns (RegisterProbeResponse);
}

// ==================== Flow 上报 ====================

message UploadFlowsRequest {
  repeated FlowEvent events = 1;
  string compression = 2;
  // Highest exact-set response revision the client can durably apply.
  uint32 accepted_response_revision = 3;
}

message UploadFlowsResponse {
  int32 accepted = 1;
  int32 rejected = 2;
  repeated string rejected_ids = 3;
  string message = 4;
  // Additive exact-set acknowledgement. When present, there is exactly one
  // result for every request input_index; old aggregate fields remain for
  // wire compatibility but cannot override these dispositions.
  repeated FlowItemResult item_results = 5;
  uint32 response_revision = 6;
}

enum FlowItemDisposition {
  FLOW_ITEM_DISPOSITION_UNSPECIFIED = 0;
  // The exact message received the configured Kafka broker acknowledgement.
  FLOW_ITEM_DISPOSITION_KAFKA_ACKED = 1;
  // The same tenant/probe/event identity was already broker committed.
  FLOW_ITEM_DISPOSITION_DUPLICATE_COMMITTED = 2;
  // Deterministic validation failure; retrying identical bytes cannot help.
  FLOW_ITEM_DISPOSITION_REJECTED_INVALID = 3;
  // Broker or dependency reported a retryable failure before a durable ACK.
  FLOW_ITEM_DISPOSITION_RETRYABLE = 4;
  // The remote outcome is ambiguous; retry must preserve the same event ID.
  FLOW_ITEM_DISPOSITION_OUTCOME_UNKNOWN = 5;
}

message FlowItemResult {
  uint32 input_index = 1;
  string event_id = 2;
  FlowItemDisposition disposition = 3;
  string reason_code = 4;
  // The only currently approved durable acceptance barrier for FlowEvent.
  string ack_scope = 5;
}

// ==================== Flow 流式上报 ====================

message StreamFlowsRequest {
  FlowEvent event = 1;
  uint32 accepted_response_revision = 2;
}

message StreamFlowsResponse {
  string event_id = 1;
  bool accepted = 2;
  string error = 3;
  FlowItemDisposition disposition = 4;
  string reason_code = 5;
  string ack_scope = 6;
  uint32 response_revision = 7;
}

// ==================== Session 上报 ====================

message UploadSessionsRequest {
  repeated SessionEvent sessions = 1;
  string compression = 2;
}

message UploadSessionsResponse {
  int32 accepted = 1;
  int32 rejected = 2;
  repeated string rejected_ids = 3;
  string message = 4;
}

// ==================== PCAP Index 上报 ====================

message UploadPcapIndexRequest {
  PcapIndexMeta index = 1;
}

message UploadPcapIndexResponse {
  bool success = 1;
  string message = 2;
}

// ==================== Passive asset binding upload ====================

message UploadAssetBindingsRequest {
  string tenant_id = 1;
  string probe_id = 2;
  repeated MacIpBinding bindings = 3;
  // Highest exact-set response revision the probe can durably apply.
  uint32 accepted_response_revision = 4;
}

enum AssetBindingItemDisposition {
  ASSET_BINDING_ITEM_DISPOSITION_UNSPECIFIED = 0;
  ASSET_BINDING_ITEM_DISPOSITION_KAFKA_ACKED = 1;
  ASSET_BINDING_ITEM_DISPOSITION_DUPLICATE_COMMITTED = 2;
  ASSET_BINDING_ITEM_DISPOSITION_REJECTED_INVALID = 3;
  ASSET_BINDING_ITEM_DISPOSITION_RETRYABLE = 4;
  ASSET_BINDING_ITEM_DISPOSITION_OUTCOME_UNKNOWN = 5;
}

message AssetBindingItemResult {
  uint32 input_index = 1;
  string observation_id = 2;
  AssetBindingItemDisposition disposition = 3;
  string reason_code = 4;
  // KAFKA_RECORD only after required-acks=all succeeds.
  string ack_scope = 5;
}

message UploadAssetBindingsResponse {
  int32 accepted = 1;
  int32 rejected = 2;
  repeated AssetBindingItemResult item_results = 3;
  uint32 response_revision = 4;
  string message = 5;
}

// ==================== 心跳 ====================

message HeartbeatRequest {
  string tenant_id = 1;
  string probe_id = 2;
  ProbeStatus status = 3;
  // Final receipts are retried by the Agent until the authenticated Gateway
  // durably accepts them. The Gateway must reject receipts whose tenant/probe
  // identity differs from the authenticated context.
  repeated ProbeOperationAck operation_acks = 4;
}

message HeartbeatResponse {
  bool ok = 1;
  ProbeConfig config = 2;
  // Commands are selected by the Gateway after authenticating tenant_id and
  // probe_id. The Agent still validates both identities, expiry, revision and
  // the deterministic command hash before execution.
  repeated ProbeOperationCommand operation_commands = 3;
  // The Agent removes a locally persisted ACK only when its operation_id is
  // returned here. An empty list is not an acknowledgement.
  repeated string accepted_ack_operation_ids = 4;
}

// ProbeOperationCommand is the edge-delivery representation of an accepted
// traffic.probe.v2.OperationRequested event. Kafka remains the durable command
// source; this message prevents exposing shared broker credentials to probes.
message ProbeOperationCommand {
  string event_id = 1;
  string tenant_id = 2;
  string probe_id = 3;
  string operation_id = 4;
  string operation_type = 5;
  int64 command_revision = 6;
  string desired_version = 7;
  string command_hash = 8;
  int64 expires_at_ms = 9;
  string trace_id = 10;
  bytes command_json = 11;
}

// ProbeOperationAck is produced only after the Agent has persisted the
// operation result locally. applied=false is a real terminal failure, never a
// transport acknowledgement or optimistic success.
message ProbeOperationAck {
  string operation_id = 1;
  int64 command_revision = 2;
  string reported_version = 3;
  string reported_hash = 4;
  string agent_version = 5;
  bool applied = 6;
  string error = 7;
  int64 acknowledged_at_ms = 8;
  bytes detail_json = 9;
}

// ProbeGroupReadinessReceiptV1 is a durable, cross-process statement about
// one broker-owned consumer-group generation. It is not a process health
// signal: receivers must validate the Kafka key and headers, the bounded
// lease, and the monotonic owner epoch before it can authorize work.
message ProbeGroupReadinessReceiptV1 {
  string receipt_id = 1;
  string consumer_group = 2;
  string observed_topic = 3;
  string member_id = 4;
  int32 generation_id = 5;
  int64 owner_epoch = 6;
  ProbeGroupReadinessStateV1 state = 7;
  int64 observed_at_ms = 8;
  int64 expires_at_ms = 9;
  string publisher_instance_id = 10;
}

enum ProbeGroupReadinessStateV1 {
  PROBE_GROUP_READINESS_STATE_V1_UNSPECIFIED = 0;
  PROBE_GROUP_READINESS_STATE_V1_ASSIGNED = 1;
  PROBE_GROUP_READINESS_STATE_V1_READY = 2;
  PROBE_GROUP_READINESS_STATE_V1_REVOKED = 3;
  PROBE_GROUP_READINESS_STATE_V1_STOPPED = 4;
}

// ==================== 探针注册 ====================

message RegisterProbeRequest {
  string tenant_id = 1;
  string probe_id = 2;
  HardwareInfo hardware = 3;
  string software_version = 4;
  string build_commit = 5;
  int64 build_timestamp = 6;
}

message RegisterProbeResponse {
  bool success = 1;
  string message = 2;
  ProbeConfig initial_config = 3;
}

// ==================== 探针状态与配置 ====================

message ProbeStatus {
  float cpu_usage = 1;
  float memory_usage = 2;
  uint64 capture_pps = 3;
  uint64 upload_bps = 4;
  uint64 packets_captured = 5;
  uint64 packets_dropped = 6;
  int64 uptime_seconds = 7;
  repeated InterfaceStatus interfaces = 10;
  // Additive authority breakdown. The legacy packets_dropped field equals
  // capture_allocation_drops + capture_kernel_drops and excludes parser,
  // downstream queue, and sender failures.
  uint64 capture_allocation_drops = 11;
  uint64 capture_kernel_drops = 12;
  uint64 capture_errors = 13;
  uint64 capture_bytes = 14;
  uint64 capture_counter_revision = 15;
}

message InterfaceStatus {
  string name = 1;
  bool link_up = 2;
  uint64 speed_mbps = 3;
  uint64 rx_packets = 4;
  uint64 tx_packets = 5;
  uint64 rx_bytes = 6;
  uint64 tx_bytes = 7;
  uint64 rx_errors = 8;
  uint64 tx_errors = 9;
  uint64 rx_crc_errors = 10;
  uint64 rx_dropped = 11;
  uint64 collisions = 12;
}

message ProbeConfig {
  string config_version = 1;
  float sample_rate = 2;
  string bpf_filter = 3;
  uint32 idle_timeout_sec = 4;
  uint32 active_timeout_sec = 5;
  uint32 batch_size = 6;
  string feature_set_version = 7;
  NetworkInterfaceConfig nic_config = 10;
  uint32 ring_buffer_size = 11;
  uint32 batch_drain_timeout_ms = 12;
}

message NetworkInterfaceConfig {
  string interface_name = 1;
  bool promiscuous_mode = 2;
  repeated string bpf_filters = 3;
  uint32 ring_buffer_size_mb = 4;
  string driver_mode = 5;
  CPUAffinityConfig cpu_affinity = 6;
}

message CPUAffinityConfig {
  repeated uint32 cpu_cores = 1;
  bool numa_aware = 2;
}

message HardwareInfo {
  string cpu_model = 1;
  uint32 cpu_cores = 2;
  uint64 memory_mb = 3;
  string os_version = 4;
  repeated NIC nics = 5;
}

message NIC {
  string name = 1;
  string mac_address = 2;
  string pci_address = 3;
  string driver = 4;
  uint64 speed_mbps = 5;
  string driver_version = 6;
}

message HardwareInfo {
  string cpu_model = 1;
  uint32 cpu_cores = 2;
  uint64 memory_mb = 3;
  string os_version = 4;
  repeated NIC nics = 5;
}

message NIC {
  string name = 1;
  string mac_address = 2;
  string pci_address = 3;
  string driver = 4;
  uint64 speed_mbps = 5;
  string driver_version = 6;
}