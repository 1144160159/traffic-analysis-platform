apiVersion: batch/v1
kind: Job
metadata:
  name: seed-alert-detail-evidence-r819
  namespace: minio
spec:
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: OnFailure
      containers:
      - name: seed-evidence
        image: docker.io/minio/mc@sha256:eb4ea9884b77704230e2423e9004d2fa738dc272876b9cc41a297d29443b8780
        imagePullPolicy: IfNotPresent
        env:
        - name: MINIO_ROOT_USER
          valueFrom:
            secretKeyRef:
              name: traffic-credentials
              key: MINIO_ACCESS_KEY
        - name: MINIO_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: traffic-credentials
              key: MINIO_SECRET_KEY
        command: ["sh", "-c"]
        args:
        - |
          set -eu
          mc alias set local http://minio.minio.svc:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"
          mc mb --ignore-existing local/traffic-evidence
          mc cp --attr "Content-Type=application/vnd.tcpdump.pcap" /fixtures/c2-tunnel.pcap local/traffic-evidence/alerts/r802/c2-tunnel.pcap
          mc cp --attr "Content-Type=application/json" /fixtures/session-primary.json local/traffic-evidence/alerts/r802/session-primary.json
          mc cp --attr "Content-Type=application/json" /fixtures/session-heartbeat.json local/traffic-evidence/alerts/r802/session-heartbeat.json
          mc cp --attr "Content-Type=text/plain" /fixtures/ids-alert-detail-r802.log local/traffic-evidence/alerts/r802/ids-alert-detail-r802.log
          mc cp --attr "Content-Type=application/json" /fixtures/path-alert-detail-r802.json local/traffic-evidence/alerts/r802/path-alert-detail-r802.json
          mc cp --attr "Content-Type=text/plain" /fixtures/hash.txt local/traffic-evidence/alerts/r802/hash.txt
          mc ls local/traffic-evidence/alerts/r802/
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 128Mi
        volumeMounts:
        - name: evidence-fixture
          mountPath: /fixtures
          readOnly: true
      volumes:
      - name: evidence-fixture
        configMap:
          name: alert-detail-evidence-fixture-r819
