# T-SEC-001 workload identities. These service accounts intentionally have no
# Kubernetes API RBAC grants; application services use external data-plane
# identities and must not inherit the namespace default token.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ingest-gateway
  namespace: traffic-analysis
  labels: {traffic.analysis/security-control: T-SEC-001}
automountServiceAccountToken: false
