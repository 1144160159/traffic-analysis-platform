apiVersion: v1
kind: ConfigMap
metadata:
  name: minio-proxy-nginx
  namespace: minio
  annotations:
    traffic.platform/minio-tls-cutover: v1
    traffic.platform/production-applied: "false"
data:
  default.conf: |
    server {
        listen 9002;
        server_name _;
        location / {
            proxy_pass https://minio.minio.svc:9001;
            proxy_ssl_server_name on;
            proxy_ssl_name minio.minio.svc;
            proxy_ssl_verify on;
            proxy_ssl_verify_depth 2;
            proxy_ssl_trusted_certificate /etc/minio-ca/ca.crt;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            sub_filter_types text/html;
            sub_filter_once off;
            sub_filter "<base href=\"/\"/>" "<base href=\"/minio/\"/>";
        }
    }
