apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-argo-runtime-traffic
  namespace: argo
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
  - from:
    - podSelector: {}
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: gateway
    # Empty namespaceSelector matches all namespaces: workflow agent pods in
    # other namespaces reconnect to argo-server/workflow-controller :2746.
    - namespaceSelector: {}
    ports:
    - {protocol: TCP, port: 2746}
  egress:
  - to:
    - podSelector: {}
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - {protocol: UDP, port: 53}
    - {protocol: TCP, port: 53}
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
---
# Ingress-only default deny for namespaces that previously had no policy.
# Egress is intentionally left open to avoid breaking live traffic; tighten
# per-workload after live reconciliation.
