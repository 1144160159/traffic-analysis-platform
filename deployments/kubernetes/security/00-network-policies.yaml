apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-middleware-runtime-traffic
  namespace: middleware
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: traffic-analysis
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: flink
    ports:
    - {protocol: TCP, port: 9092}
    - {protocol: TCP, port: 8123}
    - {protocol: TCP, port: 9000}
    - {protocol: TCP, port: 9200}
    - {protocol: TCP, port: 9669}
    - {protocol: TCP, port: 7002}
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: gateway
    ports:
    - {protocol: TCP, port: 8080}
    - {protocol: TCP, port: 7002}
  # Same-namespace traffic is restricted to known middleware listener ports
  # (Kafka/ClickHouse/OpenSearch/Nebula). Keep in sync with
  # infrastructure/0[1259]-*.yaml service/container ports.
  - from:
    - podSelector: {}
    ports:
    - {protocol: TCP, port: 9092}
    - {protocol: TCP, port: 9093}
    - {protocol: TCP, port: 8080}
    - {protocol: TCP, port: 8123}
    - {protocol: TCP, port: 9000}
    - {protocol: TCP, port: 9009}
    - {protocol: TCP, port: 9181}
    - {protocol: TCP, port: 9444}
    - {protocol: TCP, port: 9363}
    - {protocol: TCP, port: 9200}
    - {protocol: TCP, port: 9300}
    - {protocol: TCP, port: 9600}
    - {protocol: TCP, port: 9559}
    - {protocol: TCP, port: 19559}
    - {protocol: TCP, port: 9669}
    - {protocol: TCP, port: 19669}
    - {protocol: TCP, port: 9777}
    - {protocol: TCP, port: 9778}
    - {protocol: TCP, port: 19779}
    - {protocol: TCP, port: 7001}
    - {protocol: TCP, port: 7002}
  egress:
  - to:
    - podSelector: {}
    ports:
    - {protocol: TCP, port: 9092}
    - {protocol: TCP, port: 9093}
    - {protocol: TCP, port: 8080}
    - {protocol: TCP, port: 8123}
    - {protocol: TCP, port: 9000}
    - {protocol: TCP, port: 9009}
    - {protocol: TCP, port: 9181}
    - {protocol: TCP, port: 9444}
    - {protocol: TCP, port: 9363}
    - {protocol: TCP, port: 9200}
    - {protocol: TCP, port: 9300}
    - {protocol: TCP, port: 9600}
    - {protocol: TCP, port: 9559}
    - {protocol: TCP, port: 19559}
    - {protocol: TCP, port: 9669}
    - {protocol: TCP, port: 19669}
    - {protocol: TCP, port: 9777}
    - {protocol: TCP, port: 9778}
    - {protocol: TCP, port: 19779}
    - {protocol: TCP, port: 7001}
    - {protocol: TCP, port: 7002}
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - {protocol: UDP, port: 53}
    - {protocol: TCP, port: 53}
