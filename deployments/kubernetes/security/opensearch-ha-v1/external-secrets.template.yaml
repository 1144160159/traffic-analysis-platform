apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: opensearch-node-tls
  namespace: middleware
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: REPLACE_WITH_APPROVED_SECRET_STORE
  target:
    name: opensearch-node-tls
    creationPolicy: Owner
  data:
  - secretKey: ca.crt
    remoteRef: {key: REPLACE_WITH_OPENSEARCH_PKI_PATH, property: ca_crt}
  - secretKey: tls.crt
    remoteRef: {key: REPLACE_WITH_OPENSEARCH_PKI_PATH, property: tls_crt}
  - secretKey: tls.key
    remoteRef: {key: REPLACE_WITH_OPENSEARCH_PKI_PATH, property: tls_key}
---
