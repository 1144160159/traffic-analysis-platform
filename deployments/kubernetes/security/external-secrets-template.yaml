# MinIO service identities are an expand-only template. The remote values must
# be created and approved before applying any workload that references them.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: minio-service-identity-bootstrap
  namespace: minio
  annotations: {traffic.platform/production-applied: "false"}
spec:
  refreshInterval: 1h
  secretStoreRef: {name: traffic-platform-secret-store, kind: ClusterSecretStore}
  target: {name: minio-service-identity-bootstrap, creationPolicy: Owner}
  data:
  - {secretKey: PROBE_AGENT_ACCESS_KEY, remoteRef: {key: traffic-platform-prod-minio-identities, property: PROBE_AGENT_ACCESS_KEY}}
  - {secretKey: PROBE_AGENT_SECRET_KEY, remoteRef: {key: traffic-platform-prod-minio-identities, property: PROBE_AGENT_SECRET_KEY}}
  - {secretKey: ALERT_SERVICE_ACCESS_KEY, remoteRef: {key: traffic-platform-prod-minio-identities, property: ALERT_SERVICE_ACCESS_KEY}}
  - {secretKey: ALERT_SERVICE_SECRET_KEY, remoteRef: {key: traffic-platform-prod-minio-identities, property: ALERT_SERVICE_SECRET_KEY}}
  - {secretKey: ASSET_SERVICE_ACCESS_KEY, remoteRef: {key: traffic-platform-prod-minio-identities, property: ASSET_SERVICE_ACCESS_KEY}}
  - {secretKey: ASSET_SERVICE_SECRET_KEY, remoteRef: {key: traffic-platform-prod-minio-identities, property: ASSET_SERVICE_SECRET_KEY}}
  - {secretKey: FORENSICS_SERVICE_ACCESS_KEY, remoteRef: {key: traffic-platform-prod-minio-identities, property: FORENSICS_SERVICE_ACCESS_KEY}}
  - {secretKey: FORENSICS_SERVICE_SECRET_KEY, remoteRef: {key: traffic-platform-prod-minio-identities, property: FORENSICS_SERVICE_SECRET_KEY}}
  - {secretKey: MLOPS_MODEL_WRITER_ACCESS_KEY, remoteRef: {key: traffic-platform-prod-minio-identities, property: MLOPS_MODEL_WRITER_ACCESS_KEY}}
  - {secretKey: MLOPS_MODEL_WRITER_SECRET_KEY, remoteRef: {key: traffic-platform-prod-minio-identities, property: MLOPS_MODEL_WRITER_SECRET_KEY}}
  - {secretKey: FLINK_STATE_MODEL_ACCESS_KEY, remoteRef: {key: traffic-platform-prod-minio-identities, property: FLINK_STATE_MODEL_ACCESS_KEY}}
  - {secretKey: FLINK_STATE_MODEL_SECRET_KEY, remoteRef: {key: traffic-platform-prod-minio-identities, property: FLINK_STATE_MODEL_SECRET_KEY}}
  - {secretKey: ARGO_ARTIFACT_ACCESS_KEY, remoteRef: {key: traffic-platform-prod-minio-identities, property: ARGO_ARTIFACT_ACCESS_KEY}}
  - {secretKey: ARGO_ARTIFACT_SECRET_KEY, remoteRef: {key: traffic-platform-prod-minio-identities, property: ARGO_ARTIFACT_SECRET_KEY}}
