---
apiVersion: v1
kind: ConfigMap
metadata:
  name: minio-service-identity-policies-v1
  namespace: minio
  labels:
    app.kubernetes.io/name: minio-service-identities
    traffic.platform/contract-version: v1
data:
  traffic-probe-agent-v1.json: >-
    {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:GetBucketLocation"],"Resource":["arn:aws:s3:::pcap-archive"]},{"Effect":"Allow","Action":["s3:ListBucket","s3:ListBucketMultipartUploads"],"Resource":["arn:aws:s3:::pcap-archive"],"Condition":{"StringLike":{"s3:prefix":["*"]}}},{"Effect":"Allow","Action":["s3:AbortMultipartUpload","s3:ListMultipartUploadParts","s3:PutObject"],"Resource":["arn:aws:s3:::pcap-archive/*"]}]}
  traffic-alert-service-v1.json: >-
    {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:GetBucketLocation"],"Resource":["arn:aws:s3:::report-artifacts","arn:aws:s3:::pcap-archive"]},{"Effect":"Allow","Action":["s3:ListBucket"],"Resource":["arn:aws:s3:::report-artifacts"],"Condition":{"StringLike":{"s3:prefix":["*/alerts/*","*/campaigns/*"]}}},{"Effect":"Allow","Action":["s3:AbortMultipartUpload","s3:DeleteObject","s3:GetObject","s3:ListMultipartUploadParts","s3:PutObject"],"Resource":["arn:aws:s3:::report-artifacts/*/alerts/*","arn:aws:s3:::report-artifacts/*/campaigns/*"]},{"Effect":"Allow","Action":["s3:ListBucket"],"Resource":["arn:aws:s3:::pcap-archive"],"Condition":{"StringLike":{"s3:prefix":["*"]}}},{"Effect":"Allow","Action":["s3:GetObject"],"Resource":["arn:aws:s3:::pcap-archive/*"]}]}
  traffic-asset-service-v1.json: >-
    {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:GetBucketLocation"],"Resource":["arn:aws:s3:::report-artifacts","arn:aws:s3:::pcap-archive"]},{"Effect":"Allow","Action":["s3:ListBucket"],"Resource":["arn:aws:s3:::report-artifacts"],"Condition":{"StringLike":{"s3:prefix":["*/assets/exports/*"]}}},{"Effect":"Allow","Action":["s3:AbortMultipartUpload","s3:GetObject","s3:ListMultipartUploadParts","s3:PutObject"],"Resource":["arn:aws:s3:::report-artifacts/*/assets/exports/*"]},{"Effect":"Allow","Action":["s3:ListBucket"],"Resource":["arn:aws:s3:::pcap-archive"],"Condition":{"StringLike":{"s3:prefix":["*"]}}},{"Effect":"Allow","Action":["s3:GetObject"],"Resource":["arn:aws:s3:::pcap-archive/*"]}]}
  traffic-forensics-service-v1.json: >-
    {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:GetBucketLocation","s3:GetBucketVersioning","s3:GetBucketObjectLockConfiguration"],"Resource":["arn:aws:s3:::pcap-archive","arn:aws:s3:::forensics-quarantine"]},{"Effect":"Allow","Action":["s3:ListBucket"],"Resource":["arn:aws:s3:::pcap-archive"],"Condition":{"StringLike":{"s3:prefix":["*"]}}},{"Effect":"Allow","Action":["s3:GetObject","s3:GetObjectVersion"],"Resource":["arn:aws:s3:::pcap-archive/*"]},{"Effect":"Allow","Action":["s3:ListBucket","s3:ListBucketMultipartUploads"],"Resource":["arn:aws:s3:::forensics-quarantine"],"Condition":{"StringLike":{"s3:prefix":["tenants/*/restorations/*"]}}},{"Effect":"Allow","Action":["s3:AbortMultipartUpload","s3:GetObject","s3:GetObjectVersion","s3:GetObjectRetention","s3:ListMultipartUploadParts","s3:PutObject","s3:PutObjectRetention"],"Resource":["arn:aws:s3:::forensics-quarantine/tenants/*/restorations/*"]}]}
  traffic-mlops-model-writer-v1.json: >-
    {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:GetBucketLocation"],"Resource":["arn:aws:s3:::traffic-models"]},{"Effect":"Allow","Action":["s3:ListBucket"],"Resource":["arn:aws:s3:::traffic-models"],"Condition":{"StringLike":{"s3:prefix":["models/*","tenants/*/models/*"]}}},{"Effect":"Allow","Action":["s3:AbortMultipartUpload","s3:GetObject","s3:ListMultipartUploadParts","s3:PutObject"],"Resource":["arn:aws:s3:::traffic-models/models/*","arn:aws:s3:::traffic-models/tenants/*/models/*"]}]}
  traffic-flink-state-model-reader-v1.json: >-
    {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:GetBucketLocation"],"Resource":["arn:aws:s3:::flink-checkpoints","arn:aws:s3:::traffic-models"]},{"Effect":"Allow","Action":["s3:ListBucket","s3:ListBucketMultipartUploads"],"Resource":["arn:aws:s3:::flink-checkpoints"],"Condition":{"StringLike":{"s3:prefix":["checkpoints/*","ha/*","job-result-store/*","savepoints/*"]}}},{"Effect":"Allow","Action":["s3:AbortMultipartUpload","s3:DeleteObject","s3:GetObject","s3:ListMultipartUploadParts","s3:PutObject"],"Resource":["arn:aws:s3:::flink-checkpoints/checkpoints/*","arn:aws:s3:::flink-checkpoints/ha/*","arn:aws:s3:::flink-checkpoints/job-result-store/*","arn:aws:s3:::flink-checkpoints/savepoints/*"]},{"Effect":"Allow","Action":["s3:ListBucket"],"Resource":["arn:aws:s3:::traffic-models"],"Condition":{"StringLike":{"s3:prefix":["models/*","tenants/*/models/*"]}}},{"Effect":"Allow","Action":["s3:GetObject"],"Resource":["arn:aws:s3:::traffic-models/models/*","arn:aws:s3:::traffic-models/tenants/*/models/*"]}]}
  traffic-argo-artifact-controller-v1.json: >-
    {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:GetBucketLocation"],"Resource":["arn:aws:s3:::argo-artifacts"]},{"Effect":"Allow","Action":["s3:ListBucket","s3:ListBucketMultipartUploads"],"Resource":["arn:aws:s3:::argo-artifacts"],"Condition":{"StringLike":{"s3:prefix":["*"]}}},{"Effect":"Allow","Action":["s3:AbortMultipartUpload","s3:DeleteObject","s3:GetObject","s3:ListMultipartUploadParts","s3:PutObject"],"Resource":["arn:aws:s3:::argo-artifacts/*"]}]}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-service-identities-v1
  namespace: minio
  labels:
    app.kubernetes.io/name: minio-service-identities
    traffic.platform/change-phase: expand
    traffic.platform/contract-version: v1
  annotations:
    traffic.platform/approval-required: "true"
    traffic.platform/production-applied: "false"
spec:
  # Deliberately inert in the repository candidate. An approved expand window
  # must provision ExternalSecrets, review the exact diff, and unsuspend it.
  suspend: true
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio-service-identities
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
      - name: expand-identities
        image: docker.io/minio/mc@sha256:eb4ea9884b77704230e2423e9004d2fa738dc272876b9cc41a297d29443b8780
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: {drop: ["ALL"]}
          readOnlyRootFilesystem: true
        env:
        - {name: MC_CONFIG_DIR, value: /tmp/mc}
        - {name: MINIO_ROOT_USER, valueFrom: {secretKeyRef: {name: traffic-credentials, key: MINIO_ACCESS_KEY}}}
        - {name: MINIO_ROOT_PASSWORD, valueFrom: {secretKeyRef: {name: traffic-credentials, key: MINIO_SECRET_KEY}}}
        - {name: PROBE_AGENT_ACCESS_KEY, valueFrom: {secretKeyRef: {name: minio-service-identity-bootstrap, key: PROBE_AGENT_ACCESS_KEY}}}
        - {name: PROBE_AGENT_SECRET_KEY, valueFrom: {secretKeyRef: {name: minio-service-identity-bootstrap, key: PROBE_AGENT_SECRET_KEY}}}
        - {name: ALERT_SERVICE_ACCESS_KEY, valueFrom: {secretKeyRef: {name: minio-service-identity-bootstrap, key: ALERT_SERVICE_ACCESS_KEY}}}
        - {name: ALERT_SERVICE_SECRET_KEY, valueFrom: {secretKeyRef: {name: minio-service-identity-bootstrap, key: ALERT_SERVICE_SECRET_KEY}}}
        - {name: ASSET_SERVICE_ACCESS_KEY, valueFrom: {secretKeyRef: {name: minio-service-identity-bootstrap, key: ASSET_SERVICE_ACCESS_KEY}}}
        - {name: ASSET_SERVICE_SECRET_KEY, valueFrom: {secretKeyRef: {name: minio-service-identity-bootstrap, key: ASSET_SERVICE_SECRET_KEY}}}
        - {name: FORENSICS_SERVICE_ACCESS_KEY, valueFrom: {secretKeyRef: {name: minio-service-identity-bootstrap, key: FORENSICS_SERVICE_ACCESS_KEY}}}
        - {name: FORENSICS_SERVICE_SECRET_KEY, valueFrom: {secretKeyRef: {name: minio-service-identity-bootstrap, key: FORENSICS_SERVICE_SECRET_KEY}}}
        - {name: MLOPS_MODEL_WRITER_ACCESS_KEY, valueFrom: {secretKeyRef: {name: minio-service-identity-bootstrap, key: MLOPS_MODEL_WRITER_ACCESS_KEY}}}
        - {name: MLOPS_MODEL_WRITER_SECRET_KEY, valueFrom: {secretKeyRef: {name: minio-service-identity-bootstrap, key: MLOPS_MODEL_WRITER_SECRET_KEY}}}
        - {name: FLINK_STATE_MODEL_ACCESS_KEY, valueFrom: {secretKeyRef: {name: minio-service-identity-bootstrap, key: FLINK_STATE_MODEL_ACCESS_KEY}}}
        - {name: FLINK_STATE_MODEL_SECRET_KEY, valueFrom: {secretKeyRef: {name: minio-service-identity-bootstrap, key: FLINK_STATE_MODEL_SECRET_KEY}}}
        - {name: ARGO_ARTIFACT_ACCESS_KEY, valueFrom: {secretKeyRef: {name: minio-service-identity-bootstrap, key: ARGO_ARTIFACT_ACCESS_KEY}}}
        - {name: ARGO_ARTIFACT_SECRET_KEY, valueFrom: {secretKeyRef: {name: minio-service-identity-bootstrap, key: ARGO_ARTIFACT_SECRET_KEY}}}
        command: ["sh", "-c"]
        args:
        - |
          set -eu
          umask 077

          apply_identity() {
            policy_name="$1"
            policy_file="$2"
            access_key="$3"
            secret_key="$4"
            mc admin policy create local "$policy_name" "$policy_file"
            mc admin user add local "$access_key" "$secret_key"
            mc admin policy attach local "$policy_name" --user "$access_key"
            mc admin user info local "$access_key" >/dev/null
            mc admin policy info local "$policy_name" >/dev/null
          }

          mc alias set local http://minio.minio.svc:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"
          apply_identity traffic-probe-agent-v1 /policies/traffic-probe-agent-v1.json "$PROBE_AGENT_ACCESS_KEY" "$PROBE_AGENT_SECRET_KEY"
          apply_identity traffic-alert-service-v1 /policies/traffic-alert-service-v1.json "$ALERT_SERVICE_ACCESS_KEY" "$ALERT_SERVICE_SECRET_KEY"
          apply_identity traffic-asset-service-v1 /policies/traffic-asset-service-v1.json "$ASSET_SERVICE_ACCESS_KEY" "$ASSET_SERVICE_SECRET_KEY"
          apply_identity traffic-forensics-service-v1 /policies/traffic-forensics-service-v1.json "$FORENSICS_SERVICE_ACCESS_KEY" "$FORENSICS_SERVICE_SECRET_KEY"
          apply_identity traffic-mlops-model-writer-v1 /policies/traffic-mlops-model-writer-v1.json "$MLOPS_MODEL_WRITER_ACCESS_KEY" "$MLOPS_MODEL_WRITER_SECRET_KEY"
          apply_identity traffic-flink-state-model-reader-v1 /policies/traffic-flink-state-model-reader-v1.json "$FLINK_STATE_MODEL_ACCESS_KEY" "$FLINK_STATE_MODEL_SECRET_KEY"
          apply_identity traffic-argo-artifact-controller-v1 /policies/traffic-argo-artifact-controller-v1.json "$ARGO_ARTIFACT_ACCESS_KEY" "$ARGO_ARTIFACT_SECRET_KEY"

          echo "MinIO service identity expand phase verified; legacy credentials were not removed."
        resources:
          requests: {cpu: 50m, memory: 64Mi}
          limits: {cpu: 200m, memory: 256Mi}
        volumeMounts:
        - {name: policy-files, mountPath: /policies, readOnly: true}
        - {name: tmp, mountPath: /tmp}
      volumes:
      - name: policy-files
        configMap:
          name: minio-service-identity-policies-v1
      - name: tmp
        emptyDir: {}
