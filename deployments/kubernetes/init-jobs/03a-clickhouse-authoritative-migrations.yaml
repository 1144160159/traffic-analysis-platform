  202608031600_sessions_daily_rollup_v1.sql: |-
    -- T-CH-005 / WP-22
    -- Expand-only, versioned daily rollup retained beyond detailed session facts.
    --
    -- Apply this migration directly on every ClickHouse node with the authoritative
    -- migration runner. Do not use ON CLUSTER. The materialized view begins
    -- aggregating new local session rows only; historical backfill, shadow
    -- reconciliation and read cutover require a separately approved bounded job.
    --
    -- Rollback: stop readers from selecting sessions_daily_rollup_v1 and detach the
    -- materialized view only in an approved window. Retain acknowledged aggregate
    -- rows throughout the rollback and observation window.
    
    CREATE TABLE IF NOT EXISTS traffic.sessions_daily_rollup_v1_local (
      tenant_id          String,
      day                Date,
      protocol           UInt8,
      aggregate_version  UInt16,
      session_count      SimpleAggregateFunction(sum, UInt64),
      packet_count       SimpleAggregateFunction(sum, UInt64),
      byte_count         SimpleAggregateFunction(sum, UInt64),
      first_event_time   SimpleAggregateFunction(min, DateTime),
      last_event_time    SimpleAggregateFunction(max, DateTime)
    )
    ENGINE=ReplicatedAggregatingMergeTree(
      '/clickhouse/tables/{shard}/sessions_daily_rollup_v1_local',
      '{replica}'
    )
    PARTITION BY toYYYYMM(day)
    ORDER BY (tenant_id,day,protocol,aggregate_version)
    TTL toDateTime(day)+INTERVAL 365 DAY
    SETTINGS index_granularity=8192;
    
    CREATE TABLE IF NOT EXISTS traffic.sessions_daily_rollup_v1
    AS traffic.sessions_daily_rollup_v1_local
    ENGINE=Distributed(
      traffic_cluster,
      traffic,
      sessions_daily_rollup_v1_local,
      cityHash64(tenant_id,toString(day))
    );
    
    CREATE MATERIALIZED VIEW IF NOT EXISTS traffic.mv_sessions_daily_rollup_v1_local
    TO traffic.sessions_daily_rollup_v1_local
    AS
    SELECT
      tenant_id,
      toDate(toDateTime(ts_end / 1000)) AS day,
      protocol,
      toUInt16(1) AS aggregate_version,
      count() AS session_count,
      sum(toUInt64(num_pkts)) AS packet_count,
      sum(bytes_total) AS byte_count,
      min(toDateTime(ts_start / 1000)) AS first_event_time,
      max(toDateTime(ts_end / 1000)) AS last_event_time
    FROM traffic.sessions_local
    GROUP BY tenant_id,day,protocol,aggregate_version;
  202608041300_alert_trace_correlation_v1.sql: |-
    -- T-OBS-001 / WP-03
    -- Expand-only alert trace correlation. The authoritative migration runner
    -- applies this file on every ClickHouse node without ON CLUSTER.
    --
    -- Add the shadow/latest columns before the source columns so the existing
    -- SELECT * materialized view can continue writing while the migration expands.
    -- Existing rows receive an empty trace_id and remain query-compatible. New
    -- writers must supply the W3C trace ID after every node has completed expand.
    -- Rollback is application-only during the compatibility window; do not drop
    -- acknowledged trace data.
    
    ALTER TABLE traffic.alerts_latest_local
      ADD COLUMN IF NOT EXISTS trace_id String AFTER event_id;
    
    ALTER TABLE traffic.alerts_latest
      ADD COLUMN IF NOT EXISTS trace_id String AFTER event_id;
    
    ALTER TABLE traffic.alerts_local
      ADD COLUMN IF NOT EXISTS trace_id String AFTER event_id;
    
    ALTER TABLE traffic.alerts
      ADD COLUMN IF NOT EXISTS trace_id String AFTER event_id;
  202608111200_m02_pcap_manifest_v2.sql: |-
    -- T1-M02-P241-EXP-n011-l02
    -- Expand-only PCAP manifest and Kafka source-receipt columns.
    --
    -- The migration runner applies this file directly to every ClickHouse node.
    -- Existing PCAP rows remain readable with zero/empty compatibility defaults.
    -- New writers MUST validate the live engine, shard key and the ordered column
    -- contract before activating; applying this migration alone is not cutover.
    --
    -- Verify:
    --   SELECT database,table,name,type,default_expression
    --   FROM system.columns
    --   WHERE database='traffic' AND table IN ('pcap_index_local','pcap_index')
    --   ORDER BY table,position;
    -- Rollback: stop the carrier writer and retain these columns and all accepted
    -- rows. Do not DROP columns or reset Kafka offsets to hide projection facts.
    
    ALTER TABLE traffic.pcap_index_local
      ADD COLUMN IF NOT EXISTS bucket String DEFAULT '' AFTER file_key,
      ADD COLUMN IF NOT EXISTS object_version String DEFAULT '' AFTER bucket,
      ADD COLUMN IF NOT EXISTS etag String DEFAULT '' AFTER object_version,
      ADD COLUMN IF NOT EXISTS original_size UInt64 DEFAULT 0 AFTER etag,
      ADD COLUMN IF NOT EXISTS stored_size UInt64 DEFAULT 0 AFTER original_size,
      ADD COLUMN IF NOT EXISTS compression LowCardinality(String) DEFAULT '' AFTER stored_size,
      ADD COLUMN IF NOT EXISTS manifest_version UInt16 DEFAULT 0 AFTER compression,
      ADD COLUMN IF NOT EXISTS kafka_topic String DEFAULT '' AFTER created_ts,
      ADD COLUMN IF NOT EXISTS kafka_partition Int32 DEFAULT -1 AFTER kafka_topic,
      ADD COLUMN IF NOT EXISTS kafka_offset Int64 DEFAULT -1 AFTER kafka_partition,
      ADD COLUMN IF NOT EXISTS kafka_key_sha256 FixedString(64) DEFAULT repeat('0', 64) AFTER kafka_offset,
      ADD COLUMN IF NOT EXISTS kafka_headers_sha256 FixedString(64) DEFAULT repeat('0', 64) AFTER kafka_key_sha256,
      ADD COLUMN IF NOT EXISTS raw_sha256 FixedString(64) DEFAULT repeat('0', 64) AFTER kafka_headers_sha256,
      ADD COLUMN IF NOT EXISTS projection_identity FixedString(64) DEFAULT repeat('0', 64) AFTER raw_sha256;
    
    ALTER TABLE traffic.pcap_index
      ADD COLUMN IF NOT EXISTS bucket String DEFAULT '' AFTER file_key,
      ADD COLUMN IF NOT EXISTS object_version String DEFAULT '' AFTER bucket,
      ADD COLUMN IF NOT EXISTS etag String DEFAULT '' AFTER object_version,
      ADD COLUMN IF NOT EXISTS original_size UInt64 DEFAULT 0 AFTER etag,
      ADD COLUMN IF NOT EXISTS stored_size UInt64 DEFAULT 0 AFTER original_size,
      ADD COLUMN IF NOT EXISTS compression LowCardinality(String) DEFAULT '' AFTER stored_size,
      ADD COLUMN IF NOT EXISTS manifest_version UInt16 DEFAULT 0 AFTER compression,
      ADD COLUMN IF NOT EXISTS kafka_topic String DEFAULT '' AFTER manifest_version,
      ADD COLUMN IF NOT EXISTS kafka_partition Int32 DEFAULT -1 AFTER kafka_topic,
      ADD COLUMN IF NOT EXISTS kafka_offset Int64 DEFAULT -1 AFTER kafka_partition,
      ADD COLUMN IF NOT EXISTS kafka_key_sha256 FixedString(64) DEFAULT repeat('0', 64) AFTER kafka_offset,
      ADD COLUMN IF NOT EXISTS kafka_headers_sha256 FixedString(64) DEFAULT repeat('0', 64) AFTER kafka_key_sha256,
      ADD COLUMN IF NOT EXISTS raw_sha256 FixedString(64) DEFAULT repeat('0', 64) AFTER kafka_headers_sha256,
      ADD COLUMN IF NOT EXISTS projection_identity FixedString(64) DEFAULT repeat('0', 64) AFTER raw_sha256;
  202608141430_m02_pcap_projection_v2.sql: |-
    -- M02 manifest-v2 PCAP projection authority.
    --
    -- Expand only: the legacy pcap_index tables remain unchanged for PCAP cutter
    -- rollback. The carrier writer and M03 restoration reader use this isolated
    -- exact schema. Applying this DDL does not enable either writer.
    
    CREATE TABLE IF NOT EXISTS traffic.pcap_index_v2_local (
      tenant_id            String,
      probe_id             String,
      file_key              String,
      bucket                String,
      object_version        String,
      etag                  String,
      original_size         UInt64,
      stored_size           UInt64,
      compression           LowCardinality(String),
      manifest_version      UInt16,
      kafka_topic           String,
      kafka_partition       Int32,
      kafka_offset          Int64,
      kafka_key_sha256      FixedString(64),
      kafka_headers_sha256  FixedString(64),
      raw_sha256            FixedString(64),
      projection_identity   FixedString(64),
      ts_start              DateTime64(3, 'UTC'),
      ts_end                DateTime64(3, 'UTC'),
      byte_size             UInt64,
      zstd_level            UInt8,
      sha256                String,
      community_id          String,
      flow_id               String,
      offset_start          Nullable(UInt64),
      offset_end            Nullable(UInt64),
      bloom_filter_b64      String,
      community_ids         Array(String),
      created_ts            DateTime64(3, 'UTC')
    )
    ENGINE = ReplicatedReplacingMergeTree(
      '/clickhouse/tables/{shard}/pcap_index_v2_local',
      '{replica}',
      created_ts
    )
    PARTITION BY toYYYYMMDD(ts_start)
    ORDER BY (tenant_id, probe_id, file_key, projection_identity)
    TTL toDateTime(ts_start) + INTERVAL 90 DAY
    SETTINGS index_granularity = 8192;
    
    CREATE TABLE IF NOT EXISTS traffic.pcap_index_v2
    AS traffic.pcap_index_v2_local
    ENGINE = Distributed(
      traffic_cluster,
      traffic,
      pcap_index_v2_local,
      cityHash64(tenant_id, file_key)
    );
