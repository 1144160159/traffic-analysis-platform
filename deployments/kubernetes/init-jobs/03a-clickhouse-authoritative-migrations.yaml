      traffic,
      alert_evidence_links_v1_local,
      cityHash64(tenant_id,alert_id)
    );
---
apiVersion: batch/v1
kind: Job
metadata:
  name: init-clickhouse-authoritative-4d372f1d6ae6
  namespace: middleware
  labels:
    app: clickhouse-schema-migrations
    traffic.analysis/schema-authority: t-ch-001
  annotations:
    traffic.analysis/source-sha256: "4d372f1d6ae656af53336971a5aa3a56a7077cac0d5989c66b89c3d47f253c83"
    traffic.analysis/production-applied: "false"
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: clickhouse-schema-migrations
    spec:
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      securityContext:
        seccompProfile: {type: RuntimeDefault}
      containers:
      - name: migration-runner
        image: docker.io/clickhouse/clickhouse-server@sha256:458f72c00e4abc80c2950d8070bc5723b538544d72ea4a6a58d9ff4f8fadf8d7
        imagePullPolicy: IfNotPresent
        command: ["/bin/bash", "-ec"]
        args:
        - |-
          for host in $CLICKHOUSE_HOSTS; do
            ready=0
            for attempt in $(seq 1 60); do
              if clickhouse-client                 --host "$host"                 --user "$CLICKHOUSE_USER"                 --password "$CLICKHOUSE_PASSWORD"                 --query "EXISTS TABLE traffic.sessions_local" 2>/dev/null                 | grep -qx '1'; then
                ready=1
                break
              fi
              sleep 5
            done
            if [ "$ready" -ne 1 ]; then
              echo "ClickHouse baseline schema is not ready on $host" >&2
              exit 4
            fi
          done
          exec /migrations/run-migrations.sh
        env:
        - name: CLICKHOUSE_HOSTS
          value: "clickhouse-1.middleware.svc clickhouse-replica-0.clickhouse-replica.middleware.svc clickhouse-2.middleware.svc clickhouse-replica-1.clickhouse-replica.middleware.svc"
        - name: CLICKHOUSE_USER
          value: "default"
        - name: CLICKHOUSE_MIGRATIONS
          value: "/migrations"
        - name: CLICKHOUSE_CLIENT
          value: "clickhouse-client"
        - name: CLICKHOUSE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: traffic-credentials
              key: CLICKHOUSE_PASSWORD
        resources:
          requests: {cpu: "100m", memory: "128Mi"}
          limits: {cpu: "500m", memory: "512Mi"}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: {drop: ["ALL"]}
          readOnlyRootFilesystem: true
        volumeMounts:
        - name: migrations
          mountPath: /migrations
          readOnly: true
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: migrations
        configMap:
          name: clickhouse-authoritative-migrations-4d372f1d6ae6
          defaultMode: 365
      - name: tmp
        emptyDir: {}
