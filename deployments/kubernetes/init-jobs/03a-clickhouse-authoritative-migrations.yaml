    -- Rollback: stop the consumer and retain all projected revisions for replay.
    
    CREATE TABLE IF NOT EXISTS traffic.alert_evidence_links_v1_local (
      tenant_id            String,
      relation_id          UUID,
      alert_id             String,
      evidence_id          String,
