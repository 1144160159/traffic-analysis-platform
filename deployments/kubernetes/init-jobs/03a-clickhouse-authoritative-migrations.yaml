---
# Generated by scripts/clickhouse/render-kubernetes-migrations.py.
# Do not edit this file directly; the source of truth is the versioned
# migration directory and its checksum-enforcing runner.
apiVersion: v1
kind: ConfigMap
metadata:
  name: clickhouse-authoritative-migrations-4d372f1d6ae6
  namespace: middleware
  labels:
    app: clickhouse-schema-migrations
    traffic.analysis/schema-authority: t-ch-001
  annotations:
    traffic.analysis/source-sha256: "4d372f1d6ae656af53336971a5aa3a56a7077cac0d5989c66b89c3d47f253c83"
data:
  run-migrations.sh: |-
    #!/usr/bin/env bash
    set -euo pipefail
    
    # T-CH-001 authoritative ClickHouse migration runner.
    #
    # Required environment:
    #   CLICKHOUSE_PASSWORD
    # Optional environment:
    #   CLICKHOUSE_HOSTS      whitespace-separated nodes (default: localhost)
    #   CLICKHOUSE_USER       default
    #   CLICKHOUSE_MIGRATIONS repository migration directory
    #   CLICKHOUSE_CLIENT     clickhouse-client
    #
    # The runner applies every migration to every node. It never edits a migration
    # at runtime and refuses to continue if an applied version's checksum changes.
    
    script_dir=$(cd -- "$(dirname -- "${BASH_SOURCE[0]}")" && pwd)
    repo_root=$(cd -- "$script_dir/../.." && pwd)
    migration_dir=${CLICKHOUSE_MIGRATIONS:-"$repo_root/deployments/clickhouse/migrations"}
    client=${CLICKHOUSE_CLIENT:-clickhouse-client}
    hosts=${CLICKHOUSE_HOSTS:-localhost}
    user=${CLICKHOUSE_USER:-default}
    
    if [[ ! -d "$migration_dir" ]]; then
      echo "ClickHouse migration directory does not exist: $migration_dir" >&2
      exit 2
    fi
    
    if [[ -z "${CLICKHOUSE_PASSWORD+x}" ]]; then
      echo "CLICKHOUSE_PASSWORD must be set (an empty password is allowed explicitly)." >&2
      exit 2
    fi
    
    mapfile -t migration_files < <(find "$migration_dir" -maxdepth 1 -type f -name '*.sql' -print | LC_ALL=C sort)
    if [[ ${#migration_files[@]} -eq 0 ]]; then
      echo "No ClickHouse migrations found in $migration_dir" >&2
      exit 2
    fi
    
    previous_version=""
    for migration_file in "${migration_files[@]}"; do
      filename=$(basename -- "$migration_file")
      version=${filename%%_*}
      description=${filename#*_}
      description=${description%.sql}
      if [[ ! "$version" =~ ^[0-9]{12}$ ]] || [[ ! "$description" =~ ^[a-z0-9_]+$ ]]; then
        echo "Invalid migration filename: $filename" >&2
        exit 2
      fi
      if [[ -n "$previous_version" && "$version" < "$previous_version" ]]; then
        echo "Migration versions are not ordered: $previous_version then $version" >&2
        exit 2
      fi
      previous_version=$version
    
      checksum=$(sha256sum "$migration_file" | awk '{print $1}')
      for host in $hosts; do
        client_args=(
          --host "$host"
          --user "$user"
          --password "$CLICKHOUSE_PASSWORD"
        )
    
        applied_checksum=""
        if "$client" "${client_args[@]}" --query \
          "EXISTS TABLE traffic.alignment_schema_migrations_local" 2>/dev/null | grep -qx '1'; then
          applied_checksum=$("$client" "${client_args[@]}" --query \
            "SELECT argMax(checksum, applied_at) FROM traffic.alignment_schema_migrations_local WHERE version={version:String}" \
            --param_version "$version")
        fi
    
        if [[ -n "$applied_checksum" ]]; then
          if [[ "$applied_checksum" != "$checksum" ]]; then
            echo "Checksum mismatch for applied migration $version on $host" >&2
            echo "recorded=$applied_checksum candidate=$checksum" >&2
            exit 3
          fi
          echo "[$host] already applied $filename ($checksum)"
          continue
        fi
    
        echo "[$host] applying $filename ($checksum)"
        "$client" "${client_args[@]}" --multiquery < "$migration_file"
        "$client" "${client_args[@]}" --query \
          "INSERT INTO traffic.alignment_schema_migrations_local (version,checksum,description,applied_by) VALUES ({version:String},{checksum:String},{description:String},{applied_by:String})" \
          --param_version "$version" \
          --param_checksum "$checksum" \
          --param_description "$description" \
          --param_applied_by "${USER:-clickhouse-migration-runner}"
      done
    done
    
    echo "ClickHouse migrations applied successfully to: $hosts"
  202607300000_schema_authority.sql: |-
    -- T-CH-001 / WP-22
    -- Bootstrap the immutable ClickHouse migration ledger. Migrations are applied
    -- directly to every ClickHouse node by scripts/clickhouse/run-migrations.sh;
    -- therefore this file intentionally does not use ON CLUSTER.
    --
    -- The runner records the migration filename checksum only after this DDL has
    -- succeeded. A checksum mismatch for an already applied version is fatal.
    
    CREATE DATABASE IF NOT EXISTS traffic;
    
    CREATE TABLE IF NOT EXISTS traffic.alignment_schema_migrations_local (
      version       String,
      checksum      FixedString(64),
      description   String,
      applied_at    DateTime64(3, 'UTC') DEFAULT now64(3),
      applied_by    String DEFAULT 'clickhouse-migration-runner'
    )
    ENGINE = ReplicatedReplacingMergeTree(
      '/clickhouse/tables/{shard}/alignment_schema_migrations_local',
      '{replica}',
      applied_at
    )
    ORDER BY version
    SETTINGS index_granularity = 8192;
    
    CREATE TABLE IF NOT EXISTS traffic.alignment_schema_migrations
    AS traffic.alignment_schema_migrations_local
    ENGINE = Distributed(
      traffic_cluster,
      traffic,
      alignment_schema_migrations_local,
      cityHash64(version)
    );
  202607302045_alert_feedback.sql: |-
    -- F-ALERT-001 / WP-07
    -- Expand: create the sharded alert feedback source and distributed read table.
    -- Backfill: not required; existing tables and rows are retained.
    -- Verify:
    --   SELECT database,name,engine FROM system.tables
    --   WHERE database='traffic' AND name IN ('alert_feedback_local','alert_feedback');
    -- Cutover: deploy alert-service without ClickHouse DDL at startup after this
    -- migration has been executed on the traffic_cluster.
    -- Rollback: retain both tables; the change is additive and contains evidence.
    -- Compatibility: retain the current rand() sharding expression in this
    -- adoption migration. Its deterministic V2 replacement requires the separate
    -- W6 shadow/backfill/cutover sequence and must not be smuggled into DDL exit.
    
    CREATE TABLE IF NOT EXISTS traffic.alert_feedback_local (
      feedback_id       String,
      alert_id          String,
      tenant_id         String,
      user_id           String,
      label             LowCardinality(String),
      reason_code       String,
      comment           String,
      add_to_whitelist  UInt8,
      alert_type        String,
      severity          LowCardinality(String),
      model_version     String,
      rule_version      String,
      created_at        DateTime
    )
    ENGINE=ReplicatedMergeTree(
      '/clickhouse/tables/{shard}/alert_feedback_local',
      '{replica}'
    )
    PARTITION BY toYYYYMM(created_at)
    ORDER BY (tenant_id,alert_id,created_at)
    TTL created_at+INTERVAL 365 DAY;
    
    CREATE TABLE IF NOT EXISTS traffic.alert_feedback
    AS traffic.alert_feedback_local
    ENGINE=Distributed(
      traffic_cluster,
      traffic,
      alert_feedback_local,
      rand()
    );
  202608010900_campaign_projection_events_v2.sql: |-
    -- F-CAMPAIGN-001 / WP-08 and T-CH-001 / WP-22
    -- Expand-only immutable event projection for campaign aggregate and membership
    -- streams. This is deliberately separate from the legacy traffic.campaigns
    -- table so W6 shadow/backfill/reconcile/cutover remains reversible.
    --
    -- Verify:
    --   SELECT database,name,engine FROM system.tables
    --   WHERE database='traffic' AND name IN
    --     ('campaign_projection_events_v2_local','campaign_projection_events_v2');
    --   SELECT tenant_id,stream,count(),uniqExact(event_id)
    --   FROM traffic.campaign_projection_events_v2 FINAL
    --   GROUP BY tenant_id,stream;
    -- Rollback: disable CAMPAIGN_TARGET_PROJECTION_V2_ENABLED. Retain the table as
    -- immutable replay evidence; do not delete acknowledged projections.
    
    CREATE TABLE IF NOT EXISTS traffic.campaign_projection_events_v2_local (
      projection_id      FixedString(64),
      event_id            UUID,
      tenant_id           String,
      stream              LowCardinality(String),
