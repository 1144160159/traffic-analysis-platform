apiVersion: batch/v1
kind: Job
metadata:
  name: m08-n016-model-rollback-postgres-canary
  namespace: traffic-analysis
  labels:
    app: m08-n016-model-rollback-postgres-canary
    traffic.analysis/task: T1-M08-N016
  annotations:
    traffic.analysis/shared-postgres-touched: "false"
    traffic.analysis/shared-kafka-touched: "false"
    traffic.analysis/shared-flink-touched: "false"
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: m08-n016-model-rollback-postgres-canary
        traffic.analysis/task: T1-M08-N016
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: zeus-server
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      containers:
      - name: postgres-canary
        image: docker.io/library/postgres@sha256:3a5291c749cd77894b6d3e6e2135b81a29b1e864026e6d899ab01bc3656c6bc7
        imagePullPolicy: IfNotPresent
        command: ["bash", "-ceu", "--"]
        args:
        - |
          export PGDATA=/var/lib/postgresql/data/pgdata
          initdb --auth=trust --encoding=UTF8
          pg_ctl -o "-F -p 55432 -k /tmp" -w start
          trap 'pg_ctl -m fast -w stop' EXIT
          createdb -h /tmp -p 55432 traffic
          psql -v ON_ERROR_STOP=1 -h /tmp -p 55432 -d traffic <<'SQL'
          CREATE TABLE tenants (tenant_id TEXT PRIMARY KEY);
          CREATE TABLE models (model_id UUID PRIMARY KEY);
          CREATE TABLE model_versions (
            model_version TEXT PRIMARY KEY,
            tenant_id TEXT NOT NULL REFERENCES tenants(tenant_id),
            model_id UUID NOT NULL REFERENCES models(model_id),
            revision BIGINT NOT NULL,
            status TEXT NOT NULL
          );
          CREATE TABLE model_action_jobs (job_id TEXT PRIMARY KEY);
          CREATE TABLE model_update_outbox (event_id TEXT PRIMARY KEY);
          INSERT INTO tenants VALUES ('tenant-a');
          INSERT INTO models VALUES ('11111111-1111-4111-8111-111111111111');
          INSERT INTO model_versions VALUES
            ('model-v1','tenant-a','11111111-1111-4111-8111-111111111111',1,'deprecated'),
            ('model-v2','tenant-a','11111111-1111-4111-8111-111111111111',2,'active');
          INSERT INTO model_action_jobs VALUES ('job-partial'),('job-success');
          INSERT INTO model_update_outbox VALUES
            ('rollback-event-partial'),('compensation-event-partial'),('rollback-event-success');
          SQL
          psql -v ON_ERROR_STOP=1 -h /tmp -p 55432 -d traffic \
            -f /migration/202608151900_m08_model_rollback_v2.sql

          test "$(psql -At -h /tmp -p 55432 -d traffic -c "SELECT count(*) FROM information_schema.tables WHERE table_schema='public' AND table_name='model_rollback_requests'")" = "1"

          psql -v ON_ERROR_STOP=1 -h /tmp -p 55432 -d traffic <<'SQL'
          INSERT INTO model_rollback_requests (
            rollback_id,action_job_id,rollback_event_id,tenant_id,model_id,
            from_model_version,from_revision,from_package_sha256,
            target_model_version,target_revision,target_package_sha256,
            consumer_deployment_id,consumer_profile_sha256,expected_parallelism,
            request_sha256,reason,requested_by
          ) VALUES (
            '22222222-2222-4222-8222-222222222222','job-partial','rollback-event-partial',
            'tenant-a','11111111-1111-4111-8111-111111111111',
            'model-v2',2,repeat('a',64),'model-v1',1,repeat('b',64),
            'behavior-job-r1',repeat('c',64),4,repeat('d',64),
            'rollback after the canary stop threshold fired','operator-a'
          );
          UPDATE model_rollback_requests
          SET state='PARTIAL',applied_subtasks=3
          WHERE action_job_id='job-partial';
          SQL

          test "$(psql -At -h /tmp -p 55432 -d traffic -c "SELECT model_version FROM model_versions WHERE status='active'")" = "model-v2"
          if psql -v ON_ERROR_STOP=1 -h /tmp -p 55432 -d traffic -c "UPDATE model_rollback_requests SET state='RECOVERED',active_switched=true WHERE action_job_id='job-partial'"; then
            echo "partial_ack_quorum_moved_active_pointer" >&2
            exit 1
          fi

          psql -v ON_ERROR_STOP=1 -h /tmp -p 55432 -d traffic <<'SQL'
          UPDATE model_rollback_requests
          SET state='COMPENSATING',compensation_event_id='compensation-event-partial',
              failure_reason='ROLLBACK_APPLY_FAILED'
          WHERE action_job_id='job-partial';
          UPDATE model_rollback_requests
          SET state='FAILED_RESTORED',compensation_applied_subtasks=4
          WHERE action_job_id='job-partial';
          SQL
          test "$(psql -At -h /tmp -p 55432 -d traffic -c "SELECT model_version FROM model_versions WHERE status='active'")" = "model-v2"

          if psql -v ON_ERROR_STOP=1 -h /tmp -p 55432 -d traffic -c "UPDATE model_rollback_requests SET target_revision=9 WHERE action_job_id='job-partial'"; then
            echo "immutable_rollback_identity_was_rewritten" >&2
            exit 1
          fi
          if psql -v ON_ERROR_STOP=1 -h /tmp -p 55432 -d traffic -c "DELETE FROM model_rollback_requests WHERE action_job_id='job-partial'"; then
            echo "rollback_receipt_was_deleted" >&2
            exit 1
          fi

          psql -v ON_ERROR_STOP=1 -h /tmp -p 55432 -d traffic <<'SQL'
          INSERT INTO model_rollback_requests (
            rollback_id,action_job_id,rollback_event_id,tenant_id,model_id,
            from_model_version,from_revision,from_package_sha256,
            target_model_version,target_revision,target_package_sha256,
            consumer_deployment_id,consumer_profile_sha256,expected_parallelism,
            request_sha256,reason,requested_by
          ) VALUES (
            '33333333-3333-4333-8333-333333333333','job-success','rollback-event-success',
            'tenant-a','11111111-1111-4111-8111-111111111111',
            'model-v2',2,repeat('a',64),'model-v1',1,repeat('b',64),
            'behavior-job-r1',repeat('c',64),4,repeat('e',64),
            'rollback after every consumer accepted the prior model','operator-a'
          );
          BEGIN;
          UPDATE model_versions SET status='deprecated' WHERE model_version='model-v2' AND status='active';
          UPDATE model_versions SET status='active' WHERE model_version='model-v1' AND status='deprecated';
          UPDATE model_rollback_requests
          SET state='RECOVERED',applied_subtasks=4,active_switched=true,recovered_at=now()
          WHERE action_job_id='job-success';
          COMMIT;
          SQL
          test "$(psql -At -h /tmp -p 55432 -d traffic -c "SELECT model_version FROM model_versions WHERE status='active'")" = "model-v1"
          test "$(psql -At -h /tmp -p 55432 -d traffic -c "SELECT count(*) FROM model_rollback_requests WHERE state='RECOVERED' AND active_switched AND applied_subtasks=expected_parallelism")" = "1"
          test "$(psql -At -h /tmp -p 55432 -d traffic -c "SELECT count(*) FROM model_rollback_requests WHERE state='FAILED_RESTORED' AND NOT active_switched AND compensation_applied_subtasks=expected_parallelism")" = "1"

          echo '{"task":"T1-M08-N016","migration":"PASS","partial_ack_kept_active":"model-v2","failed_attempt_restored":"model-v2","exact_quorum_final_active":"model-v1","partial_false_recovery_rejected":true,"immutable_identity_rewrite_rejected":true,"receipt_delete_rejected":true}'
        resources:
          requests: {cpu: "100m", memory: "256Mi"}
          limits: {cpu: "500m", memory: "512Mi"}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: ["ALL"]}
        volumeMounts:
        - {name: migration, mountPath: /migration, readOnly: true}
        - {name: postgres-data, mountPath: /var/lib/postgresql/data}
        - {name: postgres-run, mountPath: /var/run/postgresql}
        - {name: tmp, mountPath: /tmp}
      volumes:
      - name: migration
        configMap:
          name: m08-n016-model-rollback-migration-canary
      - name: postgres-data
        emptyDir: {sizeLimit: "512Mi"}
      - name: postgres-run
        emptyDir: {sizeLimit: "16Mi"}
      - name: tmp
        emptyDir: {sizeLimit: "64Mi"}
