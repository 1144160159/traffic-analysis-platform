apiVersion: batch/v1
kind: Job
metadata:
  name: m08-n015-model-drift-postgres-canary
  namespace: traffic-analysis
  labels:
    app: m08-n015-model-drift-postgres-canary
    traffic.analysis/task: T1-M08-N015
  annotations:
    traffic.analysis/shared-postgres-touched: "false"
    traffic.analysis/shared-clickhouse-touched: "false"
    traffic.analysis/shared-argo-touched: "false"
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: m08-n015-model-drift-postgres-canary
        traffic.analysis/task: T1-M08-N015
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: zeus-server
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      containers:
      - name: postgres-canary
        image: docker.io/library/postgres@sha256:3a5291c749cd77894b6d3e6e2135b81a29b1e864026e6d899ab01bc3656c6bc7
        imagePullPolicy: IfNotPresent
        command: ["bash", "-ceu", "--"]
        args:
        - |
          export PGDATA=/var/lib/postgresql/data/pgdata
          initdb --auth=trust --encoding=UTF8
          pg_ctl -o "-F -p 55432 -k /tmp" -w start
          trap 'pg_ctl -m fast -w stop' EXIT
          createdb -h /tmp -p 55432 traffic
          psql -v ON_ERROR_STOP=1 -h /tmp -p 55432 -d traffic <<'SQL'
          CREATE TABLE tenants (tenant_id TEXT PRIMARY KEY);
          CREATE TABLE feature_sets (feature_set_id TEXT PRIMARY KEY);
          CREATE TABLE models (model_id UUID PRIMARY KEY);
          CREATE TABLE model_versions (
            model_version TEXT PRIMARY KEY,
            tenant_id TEXT NOT NULL,
            model_id UUID NOT NULL,
            status TEXT NOT NULL
          );
          INSERT INTO tenants VALUES ('tenant-a');
          INSERT INTO feature_sets VALUES ('feature-v1');
          INSERT INTO models VALUES ('11111111-1111-4111-8111-111111111111');
          INSERT INTO model_versions VALUES (
            'model-v1','tenant-a','11111111-1111-4111-8111-111111111111','active'
          );
          INSERT INTO model_versions VALUES (
            'model-v2','tenant-a','11111111-1111-4111-8111-111111111111','registered'
          );
          SQL
          psql -v ON_ERROR_STOP=1 -h /tmp -p 55432 -d traffic -f /migration/202608151700_m08_model_drift_candidate_v1.sql

          test "$(psql -At -h /tmp -p 55432 -d traffic -c "SELECT count(*) FROM information_schema.tables WHERE table_schema='public' AND table_name IN ('model_drift_evaluation_receipt','model_retrain_candidate_request')")" = "2"
          test "$(psql -At -h /tmp -p 55432 -d traffic -c "SELECT count(*) FROM information_schema.columns WHERE table_schema='public' AND table_name IN ('model_drift_evaluation_receipt','model_retrain_candidate_request')")" = "39"

          psql -v ON_ERROR_STOP=1 -h /tmp -p 55432 -d traffic <<'SQL'
          INSERT INTO model_drift_evaluation_receipt
            (evaluation_id,tenant_id,model_id,model_version,feature_set_id,policy_sha256,
             signal_sha256,decision_state,reasons,psi,max_observed_psi,false_positive_rate,
             signal_snapshot,feature_watermark,feedback_watermark,baseline_window_start,
             baseline_window_end,current_window_start,current_window_end,evaluated_at)
          VALUES
            ('22222222-2222-4222-8222-222222222222','tenant-a',
             '11111111-1111-4111-8111-111111111111','model-v1','feature-v1',repeat('a',64),
             repeat('b',64),'CANDIDATE','["psi_threshold_exceeded"]','{"pps":3.5}',3.5,0.20,
             '{"schema":"model-drift-candidate.v1"}',now()-interval '1 minute',now()-interval '1 hour',
             now()-interval '8 days',now()-interval '1 day',now()-interval '1 day',now(),now());
          INSERT INTO model_retrain_candidate_request
            (candidate_id,evaluation_id,tenant_id,model_id,baseline_model_version,feature_set_id,
             workflow_name,candidate_state,argo_namespace,workflow_template)
          VALUES
            ('33333333-3333-4333-8333-333333333333','22222222-2222-4222-8222-222222222222',
             'tenant-a','11111111-1111-4111-8111-111111111111','model-v1','feature-v1',
             'mlops-drift-33333333333333333333','PENDING_WORKFLOW','argo','mlops-training-template');

          INSERT INTO model_drift_evaluation_receipt
            (evaluation_id,tenant_id,model_id,model_version,feature_set_id,policy_sha256,
             signal_sha256,decision_state,reasons,psi,max_observed_psi,false_positive_rate,
             signal_snapshot,baseline_window_start,baseline_window_end,current_window_start,
             current_window_end,evaluated_at)
          VALUES
            ('44444444-4444-4444-8444-444444444444','tenant-a',
             '11111111-1111-4111-8111-111111111111','model-v1','feature-v1',repeat('c',64),
             repeat('d',64),'BLOCKED','["feedback_signals_stale"]','{}',0,0,
             '{"schema":"model-drift-candidate.v1"}',now()-interval '8 days',now()-interval '1 day',
             now()-interval '1 day',now(),now());

          INSERT INTO model_drift_evaluation_receipt
            (evaluation_id,tenant_id,model_id,model_version,feature_set_id,policy_sha256,
             signal_sha256,decision_state,reasons,psi,max_observed_psi,false_positive_rate,
             signal_snapshot,baseline_window_start,baseline_window_end,current_window_start,
             current_window_end,evaluated_at)
          VALUES
            ('66666666-6666-4666-8666-666666666666','tenant-a',
             '11111111-1111-4111-8111-111111111111','model-v2','feature-v1',repeat('e',64),
             repeat('f',64),'CANDIDATE','["psi_threshold_exceeded"]','{"pps":2.0}',2.0,0,
             '{"schema":"model-drift-candidate.v1"}',now()-interval '8 days',now()-interval '1 day',
             now()-interval '1 day',now(),now());

          UPDATE model_retrain_candidate_request
          SET candidate_state='WORKFLOW_SUBMITTED',workflow_submitted_at=now(),dispatch_attempts=1
          WHERE candidate_id='33333333-3333-4333-8333-333333333333';
          SQL

          if psql -v ON_ERROR_STOP=1 -h /tmp -p 55432 -d traffic -c "UPDATE model_drift_evaluation_receipt SET activation_authorized=true WHERE evaluation_id='22222222-2222-4222-8222-222222222222'"; then
            echo "evaluation_activation_authority_was_granted" >&2
            exit 1
          fi
          if psql -v ON_ERROR_STOP=1 -h /tmp -p 55432 -d traffic <<'SQL'
          INSERT INTO model_retrain_candidate_request
            (candidate_id,evaluation_id,tenant_id,model_id,baseline_model_version,feature_set_id,
             workflow_name,candidate_state,argo_namespace,workflow_template)
          VALUES
            ('55555555-5555-4555-8555-555555555555','44444444-4444-4444-8444-444444444444',
             'tenant-a','11111111-1111-4111-8111-111111111111','model-v1','feature-v1',
             'mlops-drift-55555555555555555555','PENDING_WORKFLOW','argo','mlops-training-template');
          SQL
          then
            echo "blocked_evaluation_created_candidate" >&2
            exit 1
          fi
          if psql -v ON_ERROR_STOP=1 -h /tmp -p 55432 -d traffic <<'SQL'
          INSERT INTO model_retrain_candidate_request
            (candidate_id,evaluation_id,tenant_id,model_id,baseline_model_version,feature_set_id,
             workflow_name,candidate_state,argo_namespace,workflow_template)
          VALUES
            ('77777777-7777-4777-8777-777777777777','66666666-6666-4666-8666-666666666666',
             'tenant-a','11111111-1111-4111-8111-111111111111','model-v2','feature-v1',
             'mlops-drift-77777777777777777777','PENDING_WORKFLOW','argo','mlops-training-template');
          SQL
          then
            echo "inactive_baseline_created_candidate" >&2
            exit 1
          fi
          if psql -v ON_ERROR_STOP=1 -h /tmp -p 55432 -d traffic -c "UPDATE model_retrain_candidate_request SET candidate_state='PENDING_WORKFLOW' WHERE candidate_id='33333333-3333-4333-8333-333333333333'"; then
            echo "submitted_candidate_was_downgraded" >&2
            exit 1
          fi
          if psql -v ON_ERROR_STOP=1 -h /tmp -p 55432 -d traffic -c "DELETE FROM model_drift_evaluation_receipt WHERE evaluation_id='44444444-4444-4444-8444-444444444444'"; then
            echo "drift_evaluation_was_deleted" >&2
            exit 1
          fi

          test "$(psql -At -h /tmp -p 55432 -d traffic -c "SELECT count(*) FROM model_retrain_candidate_request WHERE candidate_state='WORKFLOW_SUBMITTED' AND approval_state='NOT_REQUESTED' AND activation_authorized=false")" = "1"
          test "$(psql -At -h /tmp -p 55432 -d traffic -c "SELECT count(*) FROM model_retrain_candidate_request WHERE activation_authorized=true")" = "0"
          echo '{"task":"T1-M08-N015","migration":"PASS","tables":2,"columns":39,"candidate_receipts":1,"blocked_candidate_rejected":true,"inactive_baseline_rejected":true,"activation_bypass_rejected":true,"append_only_rejected":true}'
        resources:
          requests: {cpu: "100m", memory: "256Mi"}
          limits: {cpu: "500m", memory: "512Mi"}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: ["ALL"]}
        volumeMounts:
        - {name: migration, mountPath: /migration, readOnly: true}
        - {name: postgres-data, mountPath: /var/lib/postgresql/data}
        - {name: postgres-run, mountPath: /var/run/postgresql}
        - {name: tmp, mountPath: /tmp}
      volumes:
      - name: migration
        configMap:
          name: m08-n015-model-drift-migration-canary
      - name: postgres-data
        emptyDir: {sizeLimit: "512Mi"}
      - name: postgres-run
        emptyDir: {sizeLimit: "16Mi"}
      - name: tmp
        emptyDir: {sizeLimit: "64Mi"}
