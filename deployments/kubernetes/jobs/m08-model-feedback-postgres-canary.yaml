apiVersion: batch/v1
kind: Job
metadata:
  name: m08-n014-model-feedback-postgres-canary
  namespace: traffic-analysis
  labels:
    app: m08-n014-model-feedback-postgres-canary
    traffic.analysis/task: T1-M08-N014
  annotations:
    traffic.analysis/shared-postgres-touched: "false"
    traffic.analysis/shared-kafka-touched: "false"
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: m08-n014-model-feedback-postgres-canary
        traffic.analysis/task: T1-M08-N014
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: zeus-server
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      containers:
      - name: postgres-canary
        image: docker.io/library/postgres@sha256:3a5291c749cd77894b6d3e6e2135b81a29b1e864026e6d899ab01bc3656c6bc7
        imagePullPolicy: IfNotPresent
        command: ["bash", "-ceu", "--"]
        args:
        - |
          export PGDATA=/var/lib/postgresql/data/pgdata
          initdb --auth=trust --encoding=UTF8
          pg_ctl -o "-F -p 55432 -k /tmp" -w start
          trap 'pg_ctl -m fast -w stop' EXIT
          createdb -h /tmp -p 55432 traffic
          psql -v ON_ERROR_STOP=1 -h /tmp -p 55432 -d traffic -f /migration/202608151430_m08_model_feedback_revision_inbox_v1.sql

          test "$(psql -At -h /tmp -p 55432 -d traffic -c "SELECT count(*) FROM information_schema.tables WHERE table_schema='public' AND table_name IN ('model_feedback_revision_head','model_feedback_revision_inbox','model_feedback_revision_receipt','model_feedback_consumer_readiness_receipt')")" = "4"
          test "$(psql -At -h /tmp -p 55432 -d traffic -c "SELECT count(*) FROM information_schema.columns WHERE table_schema='public' AND table_name IN ('model_feedback_revision_head','model_feedback_revision_inbox','model_feedback_revision_receipt','model_feedback_consumer_readiness_receipt')")" = "63"

          psql -v ON_ERROR_STOP=1 -h /tmp -p 55432 -d traffic <<'SQL'
          INSERT INTO model_feedback_revision_inbox
            (event_id,feedback_id,tenant_id,prediction_id,alert_id,label,label_revision,
             adjudication_state,reason_code,model_version,rule_version,adjudicated_by,
             previous_event_id,occurred_at_ms,trace_id,payload,payload_sha256,
             kafka_topic,kafka_partition,kafka_offset,status)
          VALUES
            ('11111111-1111-4111-8111-111111111111','22222222-2222-4222-8222-222222222222',
             'tenant-a','prediction-1','alert-1','FP',1,'ADJUDICATED','KNOWN_SCANNER',
             'model-v2','rule-v7','reviewer-a',NULL,1786773600000,
             '0123456789abcdef0123456789abcdef','{"event_type":"model.feedback.v1"}',
             repeat('a',64),'model.feedback.v1',2,41,'pending');
          INSERT INTO model_feedback_revision_head
            (feedback_id,tenant_id,prediction_id,alert_id,model_version,rule_version,label,
             label_revision,adjudication_state,last_event_id,payload_sha256,occurred_at_ms)
          VALUES
            ('22222222-2222-4222-8222-222222222222','tenant-a','prediction-1','alert-1',
             'model-v2','rule-v7','FP',1,'ADJUDICATED',
             '11111111-1111-4111-8111-111111111111',repeat('a',64),1786773600000);
          INSERT INTO model_feedback_revision_receipt
            (event_id,feedback_id,tenant_id,label_revision,outcome,payload_sha256,
             kafka_topic,kafka_partition,kafka_offset)
          VALUES
            ('11111111-1111-4111-8111-111111111111','22222222-2222-4222-8222-222222222222',
             'tenant-a',1,'ACCEPTED',repeat('a',64),'model.feedback.v1',2,41);
          INSERT INTO model_feedback_consumer_readiness_receipt
            (consumer_group,candidate_sha256,contract_sha256,kafka_topic,state,
             event_id,kafka_partition,kafka_offset,observed_at)
          VALUES
            ('rule-manager-model-feedback-revision-v1',repeat('c',64),
             'c60bdb3ed674853da641d2c613530195a1ed9db62ce48606c402870ab283c7d9',
             'model.feedback.v1','READY','11111111-1111-4111-8111-111111111111',
             2,41,now());
          SQL

          if psql -v ON_ERROR_STOP=1 -h /tmp -p 55432 -d traffic <<'SQL'
          INSERT INTO model_feedback_revision_inbox
            (event_id,feedback_id,tenant_id,prediction_id,alert_id,label,label_revision,
             adjudication_state,model_version,rule_version,adjudicated_by,occurred_at_ms,
             payload,payload_sha256,kafka_topic,kafka_partition,kafka_offset)
          VALUES
            ('33333333-3333-4333-8333-333333333333','22222222-2222-4222-8222-222222222222',
             'tenant-a','prediction-1','alert-1','TP',2,'ADJUDICATED','model-v2','rule-v7',
             'reviewer-a',1786773601000,'{}',repeat('b',64),'model.feedback.v1',2,42);
          SQL
          then
            echo "revision_without_previous_event_id_was_accepted" >&2
            exit 1
          fi

          test "$(psql -At -h /tmp -p 55432 -d traffic -c "SELECT count(*) FROM model_feedback_revision_inbox")" = "1"
          test "$(psql -At -h /tmp -p 55432 -d traffic -c "SELECT count(*) FROM model_feedback_revision_receipt WHERE outcome='ACCEPTED'")" = "1"
          test "$(psql -At -h /tmp -p 55432 -d traffic -c "SELECT count(*) FROM model_feedback_consumer_readiness_receipt WHERE state='READY' AND candidate_sha256=repeat('c',64)")" = "1"
          echo '{"task":"T1-M08-N014","migration":"PASS","tables":4,"columns":63,"accepted_receipts":1,"readiness_receipts":1,"invalid_revision_rejected":true}'
        resources:
          requests: {cpu: "100m", memory: "256Mi"}
          limits: {cpu: "500m", memory: "512Mi"}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: ["ALL"]}
        volumeMounts:
        - {name: migration, mountPath: /migration, readOnly: true}
        - {name: postgres-data, mountPath: /var/lib/postgresql/data}
        - {name: postgres-run, mountPath: /var/run/postgresql}
        - {name: tmp, mountPath: /tmp}
      volumes:
      - name: migration
        configMap:
          name: m08-n014-model-feedback-migration-canary
      - name: postgres-data
        emptyDir: {sizeLimit: "512Mi"}
      - name: postgres-run
        emptyDir: {sizeLimit: "16Mi"}
      - name: tmp
        emptyDir: {sizeLimit: "64Mi"}
