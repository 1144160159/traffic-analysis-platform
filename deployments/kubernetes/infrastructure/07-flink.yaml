---
apiVersion: v1
kind: Service
metadata:
  name: flink-jobmanager
  namespace: flink
spec:
  internalTrafficPolicy: Cluster
  ipFamilies:
  - IPv4
  ipFamilyPolicy: SingleStack
  ports:
  - name: rpc
    port: 6123
    protocol: TCP
    targetPort: 6123
  - name: blob
    port: 6124
    protocol: TCP
    targetPort: 6124
  - name: ui
    port: 8081
    protocol: TCP
    targetPort: 8081
  selector:
    app: flink
    component: jobmanager
  sessionAffinity: None
  type: ClusterIP

---
# NOTE: the flink-job-config ConfigMap (previously defined at the end of this
# file) was duplicated with flink/flink-configmap.yaml under the same name.
# The single source of truth is flink/flink-configmap.yaml; this file no
# longer defines it to avoid apply-time conflicts and credential placeholders
# (empty clickhouse.password / ${OPENSEARCH_ADMIN_PASSWORD} / ${MINIO_*}).
# Flink jobs inject credentials via Secret env (see containers above).
