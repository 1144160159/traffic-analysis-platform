apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: flink-jobmanager
  namespace: flink
spec:
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  podManagementPolicy: OrderedReady
  # Two JobManager replicas run Kubernetes HA (high-availability.type:
  # kubernetes, leader election via ConfigMap + s3 storageDir). The single
  # flink-jobmanager Service below load-balances ALL replicas: rpc/blob
  # (6123/6124) work for every replica, but the REST/UI port 8081 is only
  # served by the elected leader (initial leader = jobmanager-0 due to
  # OrderedReady). Jobs must submit via the leader: use
  # flink-jobmanager-0.flink-jobmanager.flink.svc:8081 or a dedicated
  # jobmanager-rest Service pointing at the leader (add as separate PR if
  # needed).
  replicas: 2
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: flink
      component: jobmanager
  serviceName: flink-jobmanager
  template:
    metadata:
      labels:
        app: flink
        component: jobmanager
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: flink
                  component: jobmanager
              topologyKey: kubernetes.io/hostname
      containers:
      - args:
        - jobmanager
        env:
        - name: ENABLE_BUILT_IN_PLUGINS
          value: flink-s3-fs-presto-1.18.1.jar
        # alert-generator 作业 fail-fast 凭证契约:缺失即拒绝启动(禁止默认口令直连)。
        - name: CLICKHOUSE_USER
          value: default
        - name: CLICKHOUSE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: traffic-credentials
              key: CLICKHOUSE_PASSWORD
              optional: true
        # 专用告警投影用户(非 admin):live 需在 OpenSearch 创建并注入 Secret。
        - name: OPENSEARCH_USER
          valueFrom:
            secretKeyRef:
              name: traffic-credentials
              key: OPENSEARCH_USER
              optional: true
        - name: OPENSEARCH_PASSWORD
          valueFrom:
            secretKeyRef:
              name: traffic-credentials
              key: OPENSEARCH_PASSWORD
              optional: true
        - name: MINIO_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: minio-flink-state-model-credentials
              key: accesskey
        - name: MINIO_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: minio-flink-state-model-credentials
              key: secretkey
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: minio-flink-state-model-credentials
              key: accesskey
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: minio-flink-state-model-credentials
              key: secretkey
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: traffic-credentials
              key: PG_PASSWORD
        - name: KAFKA_SECURITY_PROTOCOL
          value: SASL_SSL
        - name: KAFKA_SASL_MECHANISM
          value: SCRAM-SHA-512
        - name: KAFKA_SASL_USERNAME
          valueFrom:
            secretKeyRef:
              name: traffic-credentials
              key: KAFKA_CLIENT_USERNAME
        - name: KAFKA_SASL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: traffic-credentials
              key: KAFKA_CLIENT_PASSWORD
        - name: KAFKA_SSL_TRUSTSTORE_LOCATION
          value: /etc/kafka/tls/kafka.truststore.p12
        - name: KAFKA_SSL_TRUSTSTORE_TYPE
          value: PKCS12
        - name: KAFKA_SSL_TRUSTSTORE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: traffic-credentials
              key: KAFKA_TLS_TRUSTSTORE_PASSWORD
        - name: FLINK_PROPERTIES
          value: 'jobmanager.rpc.address: flink-jobmanager.flink.svc

            jobmanager.memory.process.size: 4g

            taskmanager.memory.process.size: 8g

            taskmanager.memory.jvm-metaspace.size: 1024m

            taskmanager.numberOfTaskSlots: 32

            parallelism.default: 32

            state.backend: rocksdb

            state.checkpoints.dir: s3://flink-checkpoints/checkpoints/flink-traffic

            state.savepoints.dir: s3://flink-checkpoints/savepoints/flink-traffic

            state.backend.rocksdb.localdir: /home/k8s-data/flink/rocksdb

            s3.endpoint: http://minio.minio.svc:9000

            s3.path.style.access: true

            fs.allowed-fallback-filesystems: s3

            high-availability.type: kubernetes

            high-availability.cluster-id: flink-traffic

            high-availability.storageDir: s3://flink-checkpoints/ha/flink-traffic

            job-result-store.storage-path: s3://flink-checkpoints/job-result-store/flink-traffic

            job-result-store.delete-on-commit: false

            kubernetes.cluster-id: flink-traffic

            kubernetes.namespace: flink

            kubernetes.jobmanager.service-account: flink

            restart-strategy: fixed-delay

            restart-strategy.fixed-delay.attempts: 10

            restart-strategy.fixed-delay.delay: 10s'
        image: docker.io/library/flink@sha256:f0e9ffd07f3d43291dfaf7e0609eb2871462193275d452affbe5fac091017ae3
        imagePullPolicy: IfNotPresent
        volumeMounts:
        - mountPath: /home/k8s-data
          name: flink-local
        - mountPath: /etc/kafka/tls
          name: kafka-client-tls
          readOnly: true
        livenessProbe:
          failureThreshold: 3
          initialDelaySeconds: 60
          periodSeconds: 20
          successThreshold: 1
          tcpSocket:
            port: 6123
          timeoutSeconds: 1
        name: jobmanager
        ports:
        - containerPort: 6123
          protocol: TCP
        - containerPort: 6124
          protocol: TCP
        - containerPort: 8081
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /overview
            port: 8081
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 1
        resources:
          limits:
            cpu: '8'
            memory: 16Gi
          requests:
            cpu: '2'
            memory: 6Gi
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      serviceAccount: flink
      serviceAccountName: flink
      terminationGracePeriodSeconds: 30
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
      volumes:
      - hostPath:
          path: /home/k8s-data
          type: DirectoryOrCreate
        name: flink-local
      - name: kafka-client-tls
        secret:
          secretName: kafka-client-tls
          optional: false
  updateStrategy:
    rollingUpdate:
      partition: 0
    type: RollingUpdate

---
