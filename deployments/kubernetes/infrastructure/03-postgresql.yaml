apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-primary
  namespace: databases
spec:
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  podManagementPolicy: OrderedReady
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: postgres
      role: primary
  serviceName: postgres-primary
  template:
    metadata:
      labels:
        app: postgres
        role: primary
    spec:
      containers:
      - env:
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: traffic-credentials
              key: PG_PASSWORD
        - name: POSTGRES_DB
          value: traffic_platform
        image: docker.io/library/postgres@sha256:3a5291c749cd77894b6d3e6e2135b81a29b1e864026e6d899ab01bc3656c6bc7
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          initialDelaySeconds: 30
          periodSeconds: 15
          successThreshold: 1
          tcpSocket:
            port: 5432
          timeoutSeconds: 1
        name: postgres
        ports:
        - containerPort: 5432
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          initialDelaySeconds: 15
          periodSeconds: 5
          successThreshold: 1
          exec:
            command:
            - /bin/sh
            - -ec
            - test "$(PGPASSWORD="$POSTGRES_PASSWORD" psql -h 127.0.0.1 -U postgres -d traffic_platform -Atqc 'SELECT NOT pg_is_in_recovery()')" = t
          timeoutSeconds: 3
        resources:
          limits:
            cpu: '4'
            memory: 4Gi
          requests:
            cpu: 500m
            memory: 512Mi
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /var/lib/postgresql/data
          name: data
      dnsPolicy: ClusterFirst
      nodeSelector:
        kubernetes.io/hostname: 8-2tb
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
  updateStrategy:
    rollingUpdate:
      partition: 0
    type: RollingUpdate
  volumeClaimTemplates:
  - apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 1Ti
      selector:
        matchLabels:
          app: pg-primary
      storageClassName: local-hdd
      volumeMode: Filesystem

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-replica
  namespace: databases
spec:
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  podManagementPolicy: OrderedReady
  replicas: 2
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: postgres
      role: replica
  serviceName: postgres-replica
  template:
    metadata:
      labels:
        app: postgres
        role: replica
    spec:
      containers:
      - env:
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: traffic-credentials
              key: PG_PASSWORD
        - name: POSTGRES_REPLICATE_FROM
          value: postgres-primary.databases.svc
        image: docker.io/library/postgres@sha256:3a5291c749cd77894b6d3e6e2135b81a29b1e864026e6d899ab01bc3656c6bc7
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          initialDelaySeconds: 30
          periodSeconds: 15
          successThreshold: 1
          tcpSocket:
            port: 5432
          timeoutSeconds: 1
        name: postgres
        ports:
        - containerPort: 5432
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          initialDelaySeconds: 15
          periodSeconds: 5
          successThreshold: 1
          exec:
            command:
            - /bin/sh
            - -ec
            - test "$(PGPASSWORD="$POSTGRES_PASSWORD" psql -h 127.0.0.1 -U postgres -Atqc 'SELECT pg_is_in_recovery()')" = t
          timeoutSeconds: 3
        resources:
          limits:
            cpu: '4'
            memory: 4Gi
          requests:
            cpu: 500m
            memory: 512Mi
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /var/lib/postgresql/data
          name: data
      dnsPolicy: ClusterFirst
      initContainers:
      - args:
        - |
          if [ ! -f /var/lib/postgresql/data/standby.signal ]; then
            echo "Not a replica - cloning from primary..."
            rm -rf /var/lib/postgresql/data/*
            export PGPASSWORD="$PG_REPLICATION_PASSWORD"
            pg_basebackup -h postgres-primary.databases.svc -p 5432 -U replicator -D /var/lib/postgresql/data -R --no-password
            echo "Clone done"
          else
            echo "Replica data exists"
          fi
          chmod 700 /var/lib/postgresql/data
        command:
        - /bin/sh
        - -c
        env:
        - name: PG_REPLICATION_PASSWORD
          valueFrom:
            secretKeyRef:
              name: traffic-credentials
              key: PG_REPLICATION_PASSWORD
        image: docker.io/library/postgres@sha256:3a5291c749cd77894b6d3e6e2135b81a29b1e864026e6d899ab01bc3656c6bc7
        imagePullPolicy: IfNotPresent
        name: init-replica
        resources: {}
        securityContext:
          runAsGroup: 70
          runAsUser: 70
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /var/lib/postgresql/data
          name: data
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext:
        fsGroup: 70
      terminationGracePeriodSeconds: 30
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
  updateStrategy:
    rollingUpdate:
      partition: 0
    type: RollingUpdate
  volumeClaimTemplates:
  - apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 1Ti
      storageClassName: local-hdd
      volumeMode: Filesystem

---
