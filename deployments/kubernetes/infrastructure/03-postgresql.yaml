apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: postgres-pdb
  namespace: databases
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: postgres

---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: pg-failover-check
  namespace: databases
  annotations:
    alignment.traffic-platform.io/remediation-id: T-PG-006
    alignment.traffic-platform.io/automation-mode: readiness-only
spec:
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 3
  jobTemplate:
    metadata:
      creationTimestamp: null
    spec:
      activeDeadlineSeconds: 55
      backoffLimit: 0
      template:
        metadata:
          creationTimestamp: null
        spec:
          containers:
          - command:
            - /bin/sh
            - /scripts/failover.sh
            env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: traffic-credentials
                  key: PG_PASSWORD
            - name: PGCONNECT_TIMEOUT
              value: "5"
            image: docker.io/library/postgres@sha256:3a5291c749cd77894b6d3e6e2135b81a29b1e864026e6d899ab01bc3656c6bc7
            imagePullPolicy: IfNotPresent
            name: failover-check
            resources: {}
            terminationMessagePath: /dev/termination-log
            terminationMessagePolicy: File
            volumeMounts:
            - mountPath: /scripts
              name: script
          dnsPolicy: ClusterFirst
          restartPolicy: OnFailure
          schedulerName: default-scheduler
          securityContext: {}
          terminationGracePeriodSeconds: 30
          volumes:
          - configMap:
              defaultMode: 493
              name: pg-failover-script
            name: script
  schedule: '*/1 * * * *'
  successfulJobsHistoryLimit: 2
  suspend: false

---
apiVersion: v1
data:
  failover.sh: |
    #!/bin/sh
    # T-PG-006 safe-hold readiness check.
    # This script must never promote a replica or mutate a Service. Automated
    # failover stays disabled until one HA controller owns election, fencing,
    # epoch publication and endpoint cutover as a single verified protocol.

    set -eu

    PRIMARY_SVC="postgres-primary.databases.svc"
    export PGPASSWORD="${PGPASSWORD:?PGPASSWORD env is required}"

    PRIMARY_WRITABLE=$(psql -h "$PRIMARY_SVC" -p 5432 -U postgres -d traffic_platform -Atqc \
      "SELECT NOT pg_is_in_recovery()" 2>/dev/null || true)
    if [ "$PRIMARY_WRITABLE" != "t" ]; then
      echo "$(date -u +%Y-%m-%dT%H:%M:%SZ): BLOCKED: declared primary is unreachable or not writable; automatic promotion is disabled"
      exit 1
    fi

    for ordinal in 0 1; do
      replica="postgres-replica-${ordinal}.postgres-replica.databases.svc"
      recovery=$(psql -h "$replica" -p 5432 -U postgres -Atqc \
        "SELECT pg_is_in_recovery()" 2>/dev/null || true)
      if [ "$recovery" != "t" ]; then
        echo "$(date -u +%Y-%m-%dT%H:%M:%SZ): BLOCKED: $replica is unreachable or not a standby"
        exit 1
      fi
    done

    echo "$(date -u +%Y-%m-%dT%H:%M:%SZ): PASS: exactly the declared write endpoint is writable and both declared replicas are in recovery"
kind: ConfigMap
metadata:
  name: pg-failover-script
  namespace: databases
  annotations:
    alignment.traffic-platform.io/remediation-id: T-PG-006
    alignment.traffic-platform.io/automation-mode: readiness-only

---
