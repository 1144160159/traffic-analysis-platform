---
# Probe Agent DaemonSet — 每节点运行一个探针实例
# 采集方式: AF_XDP / AF_PACKET (hostNetwork)
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: probe-agent
  namespace: traffic-analysis
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: probe-agent
rules:
- apiGroups: [""]
  resources: ["nodes", "pods"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: probe-agent
subjects:
- kind: ServiceAccount
  name: probe-agent
  namespace: traffic-analysis
roleRef:
  kind: ClusterRole
  name: probe-agent
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: probe-agent-config
  namespace: traffic-analysis
data:
  config.yaml: |
    tenant_id: "default"
    probe_id: "probe-${NODE_NAME}"
    run_id: "realtime"
    capture:
      interface: "ens9f0"
      mode: "af_packet"
      producer_enabled: false
      queue_id: 0
      buffer_size: 65536
      frame_size: 65536
      frame_count: 4096
      promiscuous_mode: true
      cpu_cores: [0, 1]
      numa_aware: true
      # wire 回放(测试阶段虚拟网卡注入)allowlist:生产探针保持空 = 全部拒绝。
      wire_replay_interfaces: []
    aggregator:
      flow_capacity: 250000
      idle_timeout_sec: 5
      active_timeout_sec: 1800
      scan_interval_sec: 1
      tos_update_policy: "highest_dscp"
      enable_dscp_tracking: true
    archiver:
      enabled: true
      durable_spool_enabled: true
      cache_path: "/var/lib/probe-agent/cache"
      buffer_size_mb: 64
      rotation_interval_sec: 30
      zstd_level: 3
      s3_endpoint: "http://minio.minio.svc:9000"
      s3_bucket: "pcap-archive"
      s3_region: "us-east-1"
      s3_access_key: "${PROBE_S3_ACCESS_KEY}"
      s3_secret_key: "${PROBE_S3_SECRET_KEY}"
      max_concurrent_uploads: 2
    sender:
      gateway_addr: "https://ingest-gateway.traffic-analysis.svc:50051"
      tenant_id: "default"
      probe_id: "probe-${NODE_NAME}"
      batch_size: 100
      batch_timeout_ms: 100
      max_retries: 3
      tls_ca_cert: "/etc/probe-agent/certs/ca-cert.pem"
      tls_client_cert: "/etc/probe-agent/certs/client-cert.pem"
      tls_client_key: "/etc/probe-agent/certs/client-key.pem"
      cache_path: "/var/lib/probe-agent/cache"
      cache_max_size: 250000
      asset_binding_upload_enabled: false
      asset_binding_canary_tenant_id: ""
      asset_binding_canary_probe_ids: []
    metrics:
      enabled: true
      listen_addr: "0.0.0.0:9091"
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: probe-agent
  namespace: traffic-analysis
spec:
  selector:
    matchLabels: {app: probe-agent}
  template:
    metadata:
      labels: {app: probe-agent}
      annotations: {prometheus.io/scrape: "true", prometheus.io/port: "9091"}
    spec:
      serviceAccountName: probe-agent
      terminationGracePeriodSeconds: 90
      hostNetwork: true
      # hostPID disabled: the probe does not need to observe host processes.
      # Re-enable only with a documented, reviewed requirement.
      hostPID: false
      dnsPolicy: ClusterFirstWithHostNet
      containers:
      - name: probe-agent
        image: docker.io/traffic/probe-agent:capture-window-20260817v1
        imagePullPolicy: IfNotPresent
        args: ["/etc/probe-agent/config.yaml"]
        securityContext:
          # Privileged mode removed; AF_PACKET/AF_XDP capture needs only the
          # capabilities below. If a target NIC requires extra capabilities
          # (e.g. AF_XDP with huge pages), add the minimal set here — never
          # restore privileged:true.
          privileged: false
          runAsUser: 0
          runAsGroup: 0
          capabilities:
            add: ["NET_ADMIN", "NET_RAW", "SYS_NICE"]
        env:
        - name: NODE_NAME
          valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
        - name: RUST_LOG
          value: "probe_agent=info"
        # 实时采集数据面(人工选择实时采集):生产开关 + 精确探针 allow-list
        # 一起打开;只对 probe-8-2tb 放行,其余探针保持 producer off。
        - name: M02_CAPTURE_PRODUCER_V1_ENABLED
          value: "true"
        - name: M02_CAPTURE_CANARY_PROBE_IDS
          value: "probe-8-2tb"
        # M06 passive bindings use the existing authenticated gRPC channel and
        # a durable local WAL. All three values must be patched together for an
        # exact tenant/probe canary; the probe never receives Kafka credentials.
        - name: M06_ASSET_BINDING_UPLOAD_V1_ENABLED
          value: "false"
        - name: M06_ASSET_BINDING_CANARY_TENANT_ID
          value: ""
        - name: M06_ASSET_BINDING_CANARY_PROBE_IDS
          value: ""
        - name: AUTH_TOKEN
          valueFrom:
            secretKeyRef:
              name: traffic-credentials
              key: PROBE_AUTH_TOKEN
        - name: PROBE_S3_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: minio-probe-agent-credentials
              key: accesskey
        - name: PROBE_S3_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: minio-probe-agent-credentials
              key: secretkey
        ports:
        - {containerPort: 9091, name: metrics}
        livenessProbe:
          httpGet: {path: /metrics, port: 9091}
          initialDelaySeconds: 30
          periodSeconds: 15
          timeoutSeconds: 3
          failureThreshold: 4
        readinessProbe:
          httpGet: {path: /metrics, port: 9091}
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          requests: {cpu: "2", memory: "4Gi"}
          limits:   {cpu: "4", memory: "8Gi"}
        volumeMounts:
        - {name: config, mountPath: /etc/probe-agent}
        - {name: cache, mountPath: /var/lib/probe-agent}
        - {name: certs, mountPath: /etc/probe-agent/certs, readOnly: true}
      volumes:
      - {name: config, configMap: {name: probe-agent-config}}
      - {name: cache, hostPath: {path: /home/data/probe-agent-v2, type: DirectoryOrCreate}}
      - {name: certs, secret: {secretName: probe-agent-certs, optional: false}}
      tolerations:
      - operator: Exists
