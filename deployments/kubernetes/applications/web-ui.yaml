---
# Web UI — React + Vite 前端
---
apiVersion: v1
kind: Service
metadata: {name: web-ui, namespace: traffic-analysis, labels: {app: web-ui}}
spec:
  type: ClusterIP
  selector: {app: web-ui}
  ports:
  - {name: http, port: 80, targetPort: 80}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-ui
  namespace: traffic-analysis
  annotations:
    kubernetes.io/change-cause: "Topic domain r761 renders scope editing as an intrinsic modal and restores readable topology node typography with boundary-anchored links"
    traffic.analysis/source-revision: "db0a01658f3d98c93f24b859246f4b80d4bc0320ef9a90ededdce79d2d83a0b1"
spec:
  replicas: 1
  selector: {matchLabels: {app: web-ui}}
  template:
    metadata:
      labels: {app: web-ui}
      annotations:
        traffic.analysis/build-id: "topic-domain-r761"
        traffic.analysis/release: "topic-domain-r761"
        traffic.analysis/source-digest: "db0a01658f3d98c93f24b859246f4b80d4bc0320ef9a90ededdce79d2d83a0b1"
        traffic.analysis/image-digest: "sha256:7621ff5c473179adc04093a33aa715059bce418d0b32dc2f10f51960c8529a8e"
        traffic.analysis/image-id: "sha256:d251d20498d2d4341c7e95bd375261afbd29d25c97d5782b6832635973019c3f"
    spec:
      terminationGracePeriodSeconds: 30
      containers:
      - name: web-ui
        image: docker.io/traffic/web-ui:topic-domain-r761
        imagePullPolicy: Never
        ports: [{containerPort: 80}]
        lifecycle:
          preStop:
            exec: {command: ["/bin/sh", "-c", "sleep 10"]}
        env:
        - {name: API_BASE_URL, value: "/api"}
        - {name: API_BACKEND_HOST, value: "apisix.gateway.svc"}
        - {name: API_BACKEND_PORT, value: "9080"}
        - {name: WS_URL, value: "/ws/events"}
        - {name: WS_BACKEND_HOST, value: "apisix.gateway.svc"}
        - {name: WS_BACKEND_PORT, value: "9080"}
        - {name: VITE_ENABLE_WEBSOCKET, value: "true"}
        - {name: ENABLE_REALTIME, value: "true"}
        - {name: AUTH_ENABLED, value: "true"}
        - {name: USE_MOCK, value: "false"}
        - {name: ALERT_DETAIL_API_ENABLED, value: "false"}
        - {name: SCREEN_ACCESS_MODE, value: "protected"}
        - {name: DESKTOP_SMOKE_TOKEN_ENABLED, value: "true"}
        resources: {requests: {cpu: 100m, memory: 128Mi, ephemeral-storage: 128Mi}, limits: {cpu: 500m, memory: 512Mi, ephemeral-storage: 512Mi}}
        livenessProbe:  {httpGet: {path: /, port: 80}, initialDelaySeconds: 10, periodSeconds: 15}
        readinessProbe: {httpGet: {path: /, port: 80}, initialDelaySeconds: 5, periodSeconds: 10}
