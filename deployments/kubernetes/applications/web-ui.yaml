---
# Web UI — React + Vite 前端
---
apiVersion: v1
kind: Service
metadata: {name: web-ui, namespace: traffic-analysis, labels: {app: web-ui}}
spec:
  type: ClusterIP
  selector: {app: web-ui}
  ports:
  - {name: http, port: 80, targetPort: 80}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-ui
  namespace: traffic-analysis
  annotations:
    kubernetes.io/change-cause: "Topic panel r892 locks APT and encrypted-tunnel analysis geometry within each browser viewport"
    traffic.analysis/source-revision: "5a657cecd0616a8e8d514847e35c66cdf19c3eaa0a4bda134fa254eb34b1ac61"
spec:
  replicas: 1
  selector: {matchLabels: {app: web-ui}}
  template:
    metadata:
      labels: {app: web-ui}
      annotations:
        traffic.analysis/build-id: "topic-panel-r892"
        traffic.analysis/release: "topic-panel-r892"
        traffic.analysis/source-digest: "5a657cecd0616a8e8d514847e35c66cdf19c3eaa0a4bda134fa254eb34b1ac61"
        traffic.analysis/image-digest: "sha256:b6b820a96a31ea4fbe37ca5d4795d9a703aaf71efe6e2473d06246fa8e9e0980"
        traffic.analysis/image-id: "sha256:fd9a69a8605614fe9dad9c9a630f4691839fdc90f93c84b1814ba8357d2d1904"
    spec:
      terminationGracePeriodSeconds: 30
      containers:
      - name: web-ui
        image: docker.io/traffic/web-ui:topic-panel-r892
        imagePullPolicy: Never
        ports: [{containerPort: 80}]
        lifecycle:
          preStop:
            exec: {command: ["/bin/sh", "-c", "sleep 10"]}
        env:
        - {name: API_BASE_URL, value: "/api"}
        - {name: API_BACKEND_HOST, value: "apisix.gateway.svc"}
        - {name: API_BACKEND_PORT, value: "9080"}
        - {name: WS_URL, value: "/ws/events"}
        - {name: WS_BACKEND_HOST, value: "apisix.gateway.svc"}
        - {name: WS_BACKEND_PORT, value: "9080"}
        - {name: VITE_ENABLE_WEBSOCKET, value: "true"}
        - {name: ENABLE_REALTIME, value: "true"}
        - {name: AUTH_ENABLED, value: "true"}
        - {name: USE_MOCK, value: "false"}
        - {name: ALERT_DETAIL_API_ENABLED, value: "true"}
        - {name: SCREEN_ACCESS_MODE, value: "protected"}
        - {name: DESKTOP_SMOKE_TOKEN_ENABLED, value: "true"}
        resources: {requests: {cpu: 100m, memory: 128Mi, ephemeral-storage: 128Mi}, limits: {cpu: 500m, memory: 512Mi, ephemeral-storage: 512Mi}}
        livenessProbe:  {httpGet: {path: /, port: 80}, initialDelaySeconds: 10, periodSeconds: 15}
        readinessProbe: {httpGet: {path: /, port: 80}, initialDelaySeconds: 5, periodSeconds: 10}
