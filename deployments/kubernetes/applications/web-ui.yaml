---
# Web UI — React + Vite 前端
---
apiVersion: v1
kind: Service
metadata: {name: web-ui, namespace: traffic-analysis, labels: {app: web-ui}}
spec:
  type: ClusterIP
  selector: {app: web-ui}
  ports:
  - {name: http, port: 80, targetPort: 80}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-ui
  namespace: traffic-analysis
  annotations:
    kubernetes.io/change-cause: "P2 manual-selection wizard: save draft -> maker/checker approve -> trigger (AUTO_DEFAULT/MANUAL_CUSTOM contract)"
    traffic.analysis/source-sha256: "f6072c454"
    traffic.analysis/image-manifest-digest: "sha256:55623f10d5df2cad5a5378f19d1193f2571d27d04b23e0740c2a0ce7a9d04801"
spec:
  replicas: 1
  selector: {matchLabels: {app: web-ui}}
  template:
    metadata:
      labels: {app: web-ui}
      annotations:
        traffic.analysis/build-id: "p2-manual-train-f6072c454"
        traffic.analysis/release: "analysis-p2-manual-train-20260816"
        traffic.analysis/source-sha256: "f6072c454"
        traffic.analysis/image-manifest-digest: "sha256:55623f10d5df2cad5a5378f19d1193f2571d27d04b23e0740c2a0ce7a9d04801"
        traffic.analysis/image-id: "sha256:55623f10d5df2cad5a5378f19d1193f2571d27d04b23e0740c2a0ce7a9d04801"
        traffic.analysis/identity-prerequisite: "service-account-v1"
    spec:
      serviceAccountName: web-ui
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      containers:
      - name: web-ui
        image: docker.io/traffic/web-ui:loginfix-20260818
        imagePullPolicy: Never
        ports: [{containerPort: 80}]
        lifecycle:
          preStop:
            exec: {command: ["/bin/sh", "-c", "sleep 10"]}
        env:
        - {name: API_BASE_URL, value: "/api"}
        - {name: API_BACKEND_HOST, value: "apisix.gateway.svc"}
        - {name: API_BACKEND_PORT, value: "9080"}
        - {name: WS_URL, value: "/ws/events"}
        - {name: WS_BACKEND_HOST, value: "apisix.gateway.svc"}
        - {name: WS_BACKEND_PORT, value: "9080"}
        - {name: VITE_ENABLE_WEBSOCKET, value: "true"}
        - {name: ENABLE_REALTIME, value: "true"}
        - {name: AUTH_ENABLED, value: "true"}
        - {name: USE_MOCK, value: "false"}
        - {name: ALERT_DETAIL_API_ENABLED, value: "true"}
        - {name: ALERT_SEARCH_CURSOR_V1_ENABLED, value: "false"}
        - {name: ASSET_DETAIL_SNAPSHOT_V1_ENABLED, value: "false"}
        - {name: ASSET_GOVERNANCE_V1_ENABLED, value: "false"}
        - {name: SCREEN_ACCESS_MODE, value: "protected"}
        - {name: DESKTOP_SMOKE_TOKEN_ENABLED, value: "true"}
        resources: {requests: {cpu: 100m, memory: 128Mi, ephemeral-storage: 128Mi}, limits: {cpu: 500m, memory: 512Mi, ephemeral-storage: 512Mi}}
        livenessProbe:  {httpGet: {path: /, port: 80}, initialDelaySeconds: 10, periodSeconds: 15}
        readinessProbe: {httpGet: {path: /, port: 80}, initialDelaySeconds: 5, periodSeconds: 10}
