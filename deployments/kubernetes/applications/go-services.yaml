---
# Go 控制面服务 — 8 个微服务
# 依赖：Kafka(middleware), ClickHouse(middleware), PG(databases), Redis(databases)
---
# ---- Ingest Gateway (gRPC 50051, Management HTTP 8080, Metrics 9091) ----
apiVersion: v1
kind: Service
metadata: {name: ingest-gateway, namespace: traffic-analysis, labels: {app: ingest-gateway}}
spec:
  type: ClusterIP
  selector: {app: ingest-gateway}
  ports:
  - {name: grpc, port: 50051, targetPort: 50051}
  - {name: management, port: 8080, targetPort: 8080}
  - {name: metrics, port: 9091, targetPort: 9091}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingest-gateway
  namespace: traffic-analysis
  annotations:
    kubernetes.io/change-cause: "Kafka DLQ security fail-closed r3 from e3316aec worktree"
spec:
  replicas: 2
  selector: {matchLabels: {app: ingest-gateway}}
  template:
    metadata:
      labels: {app: ingest-gateway}
      annotations: {prometheus.io/scrape: "true", prometheus.io/port: "9091", traffic.analysis/build-id: "kafka-security-20260712-r3-worktree"}
    spec:
      serviceAccountName: ingest-gateway
      automountServiceAccountToken: false
      initContainers:
      - name: init-dlq-fallback-dir
        image: docker.io/traffic/ingest-gateway@sha256:b6bf1db5f0d69bbb9140822ecdec74104b36235fe4fdcffda5648d5bf135c318
        imagePullPolicy: Never
        command: ["sh", "-c", "mkdir -p /var/log/ingest-gateway/dlq-fallback && chown -R 1000:1000 /var/log/ingest-gateway"]
        securityContext: {runAsUser: 0, runAsGroup: 0}
        volumeMounts:
        - {name: dlq-fallback, mountPath: /var/log/ingest-gateway}
      containers:
      - name: ingest-gateway
        securityContext: {runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, allowPrivilegeEscalation: false, capabilities: {drop: ["ALL"]}, seccompProfile: {type: RuntimeDefault}}
        image: docker.io/traffic/ingest-gateway@sha256:7e5895b2402581820859acbf48c5a0a532237ab2352826cfcf199d0c2a1f5d0a
        imagePullPolicy: Never
        ports: [{containerPort: 50051}, {containerPort: 8080}, {containerPort: 9091}]
        env:
        - {name: ENVIRONMENT, value: "production"}
        - {name: GRPC_ADDR, value: ":50051"}
        - {name: HEALTH_ADDR, value: ":8080"}
        - {name: METRICS_ADDR, value: ":9091"}
        - {name: KAFKA_BROKERS, value: "kafka-bootstrap.middleware.svc:9092"}
        - {name: KAFKA_SECURITY_PROTOCOL, value: "SASL_SSL"}
        - {name: KAFKA_SASL_MECHANISM, value: "SCRAM-SHA-512"}
        - {name: KAFKA_SASL_USERNAME, valueFrom: {secretKeyRef: {name: kafka-ingest-gateway-credentials, key: username}}}
        - {name: KAFKA_SASL_PASSWORD, valueFrom: {secretKeyRef: {name: kafka-ingest-gateway-credentials, key: password}}}
        - {name: KAFKA_TLS_CA_FILE, value: "/etc/kafka/tls/ca.crt"}
        - {name: KAFKA_TLS_SERVER_NAME, value: "kafka-bootstrap.middleware.svc"}
        - {name: KAFKA_PROBE_CONTROL_TOPIC, value: "probe.control.v2"}
        - {name: KAFKA_PROBE_ACK_TOPIC, value: "probe.acks.v2"}
        - {name: KAFKA_PROBE_CONTROL_GROUP, value: "ingest-gateway-probe-control-v2"}
        - {name: REDIS_SENTINEL_ADDRS, value: "redis-sentinel.databases.svc:26379"}
        - {name: REDIS_SENTINEL_MASTER, value: "mymaster"}
        - {name: REDIS_DB, value: "0"}
        - {name: REDIS_RELIABILITY_DOMAIN, value: "coordination"}
        - {name: POSTGRES_HOST, value: "postgres-primary.databases.svc"}
        - {name: POSTGRES_PORT, value: "5432"}
        - {name: POSTGRES_DATABASE, value: "traffic_platform"}
        - {name: POSTGRES_USERNAME, value: "postgres"}
        - {name: POSTGRES_PASSWORD, valueFrom: {secretKeyRef: {name: traffic-credentials, key: PG_PASSWORD}}}
        - {name: JWT_SIGNING_KEY, valueFrom: {secretKeyRef: {name: traffic-credentials, key: JWT_SECRET}}}
        - {name: REQUIRE_MTLS, value: "true"}
        - {name: MTLS_SHARED_IDENTITY, value: "probe-agent"}
        - {name: TLS_CA_FILE, value: "/etc/ingest-gateway/certs/ca-cert.pem"}
        - {name: TLS_CERT_FILE, value: "/etc/ingest-gateway/certs/server-cert.pem"}
        - {name: TLS_KEY_FILE, value: "/etc/ingest-gateway/certs/server-key.pem"}
        - {name: LOG_LEVEL, value: "info"}
        resources: {requests: {cpu: "1", memory: 512Mi}, limits: {cpu: "2", memory: 1Gi}}
        livenessProbe:  {httpGet: {path: /health, port: 8080}, initialDelaySeconds: 10, periodSeconds: 15}
        readinessProbe: {httpGet: {path: /health, port: 8080}, initialDelaySeconds: 5, periodSeconds: 10}
        volumeMounts:
        - {name: certs, mountPath: /etc/ingest-gateway/certs, readOnly: true}
        - {name: kafka-client-tls, mountPath: /etc/kafka/tls, readOnly: true}
        - {name: dlq-fallback, mountPath: /var/log/ingest-gateway}
      volumes:
      - {name: certs, secret: {secretName: ingest-gateway-certs, optional: false}}
      - {name: kafka-client-tls, secret: {secretName: kafka-client-tls, optional: false}}
      - {name: dlq-fallback, emptyDir: {}}
---
# ---- Auth Service (HTTP 8081, Metrics 9092) ----
apiVersion: v1
kind: Service
metadata: {name: auth-service, namespace: traffic-analysis, labels: {app: auth-service}}
spec:
  selector: {app: auth-service}
  ports:
  - {name: http, port: 8081}
  - {name: metrics, port: 9092}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: traffic-analysis
  annotations:
    kubernetes.io/change-cause: "Principal-scoped navigation idempotency and support audit request r520"
    traffic.analysis/source-revision: "not-found-r520"
spec:
  replicas: 1
  selector: {matchLabels: {app: auth-service}}
  template:
    metadata:
      labels: {app: auth-service}
      annotations: {prometheus.io/scrape: "true", prometheus.io/port: "9092", traffic.analysis/build-id: "not-found-20260720-r520", traffic.analysis/image-digest: "sha256:d02bbf843802240955626a728781b220f89e90c92762639196d98c3165c383b6", traffic.analysis/image-id: "sha256:edf8c8c1943608ba2646d5b1eb2c6cb7a40d1763f3eb0b4395b5fa1fc538fd29"}
    spec:
      serviceAccountName: auth-service
      automountServiceAccountToken: false
      securityContext: {fsGroup: 1000, fsGroupChangePolicy: OnRootMismatch}
      containers:
      - name: auth-service
        securityContext: {runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, allowPrivilegeEscalation: false, capabilities: {drop: ["ALL"]}, seccompProfile: {type: RuntimeDefault}}
        image: docker.io/traffic/auth-service@sha256:d02bbf843802240955626a728781b220f89e90c92762639196d98c3165c383b6
        imagePullPolicy: Never
        ports: [{containerPort: 8081}, {containerPort: 9092}]
        env:
        - {name: SERVER_LISTEN_ADDR, value: ":8081"}
        - {name: POSTGRES_HOST, value: "postgres-primary.databases.svc"}
        - {name: POSTGRES_PORT, value: "5432"}
        - {name: POSTGRES_DATABASE, value: "traffic_platform"}
        - {name: POSTGRES_USERNAME, value: "postgres"}
        - {name: POSTGRES_PASSWORD, valueFrom: {secretKeyRef: {name: traffic-credentials, key: PG_PASSWORD}}}
        - {name: REDIS_ENABLED, value: "true"}
        - {name: REDIS_SENTINEL_ADDRS, value: "redis-sentinel.databases.svc:26379"}
        - {name: REDIS_SENTINEL_MASTER, value: "mymaster"}
        - {name: REDIS_DB, value: "1"}
        - {name: REDIS_RELIABILITY_DOMAIN, value: "session"}
        - {name: KAFKA_BROKERS, value: "kafka-bootstrap.middleware.svc:9092"}
        - {name: KAFKA_USER_EVENT_TOPIC, value: "user.events.v1"}
        - {name: KAFKA_SECURITY_PROTOCOL, value: "SASL_SSL"}
        - {name: KAFKA_SASL_MECHANISM, value: "SCRAM-SHA-512"}
        - {name: KAFKA_SASL_USERNAME, valueFrom: {secretKeyRef: {name: kafka-auth-service-credentials, key: username}}}
        - {name: KAFKA_SASL_PASSWORD, valueFrom: {secretKeyRef: {name: kafka-auth-service-credentials, key: password}}}
        - {name: KAFKA_TLS_CA_FILE, value: "/etc/kafka/tls/ca.crt"}
        - {name: KAFKA_TLS_SERVER_NAME, value: "kafka-bootstrap.middleware.svc"}
        - {name: OIDC_ENABLED, value: "true"}
        - {name: OIDC_ISSUER_URL, value: "http://10.0.5.8:30180/realms/master"}
        - {name: OIDC_CLIENT_ID, value: "traffic-ui"}
        - {name: OIDC_CLIENT_SECRET, valueFrom: {secretKeyRef: {name: traffic-credentials, key: OIDC_CLIENT_SECRET}}}
        - {name: OIDC_REDIRECT_URL, value: "http://10.0.5.8:30180/api/v1/auth/oidc/callback"}
        - {name: JWT_SIGNING_KEY, valueFrom: {secretKeyRef: {name: traffic-credentials, key: JWT_SECRET}}}
        - {name: LOG_LEVEL, value: "info"}
        resources: {requests: {cpu: 200m, memory: 256Mi}, limits: {cpu: 500m, memory: 512Mi}}
        livenessProbe:  {httpGet: {path: /health, port: 8081}, initialDelaySeconds: 10, periodSeconds: 15}
        readinessProbe: {httpGet: {path: /health/ready, port: 8081}, initialDelaySeconds: 5, periodSeconds: 10}
        volumeMounts:
        - {name: kafka-client-tls, mountPath: /etc/kafka/tls, readOnly: true}
        - {name: audit-backup, mountPath: /var/log/audit}
      volumes:
      - {name: kafka-client-tls, secret: {secretName: kafka-client-tls, optional: false}}
      - {name: audit-backup, emptyDir: {}}
