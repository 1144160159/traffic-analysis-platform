apiVersion: v1
data:
  apisix.yaml: |
    routes:
    - id: 1
      uri: /grafana
      upstream:
        type: roundrobin
        nodes:
          grafana.observability.svc:3000: 1
        timeout:
          connect: 5
          send: 60
          read: 60
        retries: 0
      plugins:
        request-id:
          header_name: X-Request-ID
          include_in_response: true
          algorithm: uuid
        limit-req:
          rate: 30
          burst: 60
          key: remote_addr
          key_type: var
          nodelay: true
          rejected_code: 429
          policy: local
        openid-connect:
          client_id: traffic-ui
          client_secret: $ENV://APISIX_OIDC_CLIENT_SECRET
          discovery: https://keycloak.iam.svc:8443/realms/master/.well-known/openid-configuration
          bearer_only: true
          realm: master
          use_jwks: true
          ssl_verify: true
        client-control:
          max_body_size: 10485760
        request-validation:
          header_schema:
            type: object
            properties:
              content-length:
                type: string
                pattern: ^[0-9]{1,10}$
              content-type:
                type: string
                maxLength: 256
            additionalProperties: true
          rejected_code: 400
          rejected_msg: request headers violate the gateway contract
