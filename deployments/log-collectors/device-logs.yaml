apiVersion: v1
kind: ServiceAccount
metadata:
  name: device-log-collector
  namespace: traffic-analysis
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: device-log-collector
  namespace: traffic-analysis
  labels:
    app.kubernetes.io/name: device-log-collector
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: device-log-collector
  ports:
  - {name: syslog-tcp, port: 5514, targetPort: syslog-tcp, protocol: TCP}
  - {name: syslog-udp, port: 5514, targetPort: syslog-udp, protocol: UDP}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: device-log-collector
  namespace: traffic-analysis
  annotations:
    traffic.analysis/production-applied: "false"
    traffic.analysis/enablement: "Patch an approved non-empty device/tenant map, then scale exactly one canary replica"
spec:
  # Repository baseline is deliberately inert. Enabling is an N017 canary OPS action.
  replicas: 0
  serviceName: device-log-collector
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: device-log-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: device-log-collector
        traffic.analysis/source: device-logs-v1
    spec:
      serviceAccountName: device-log-collector
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 90
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
      - name: vector
        image: docker.io/timberio/vector@sha256:aafeecfeac2cf9ff2f19d63ed405da1be3221b154bfceac30d07054f5148071e
        imagePullPolicy: IfNotPresent
        args: ["--config", "/etc/vector/vector.yaml"]
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
          capabilities: {drop: ["ALL"]}
          readOnlyRootFilesystem: true
          seccompProfile: {type: RuntimeDefault}
        ports:
        - {name: syslog-tcp, containerPort: 5514, protocol: TCP}
        - {name: syslog-udp, containerPort: 5514, protocol: UDP}
        - {name: vector-api, containerPort: 8686, protocol: TCP}
        env:
        - {name: KAFKA_BOOTSTRAP_SERVERS, value: "kafka-bootstrap.middleware.svc:9092"}
        - {name: KAFKA_SASL_USERNAME, valueFrom: {secretKeyRef: {name: kafka-device-log-collector-credentials, key: username}}}
        - {name: KAFKA_SASL_PASSWORD, valueFrom: {secretKeyRef: {name: kafka-device-log-collector-credentials, key: password}}}
        - {name: DEVICE_TENANT_MAP_JSON, valueFrom: {configMapKeyRef: {name: device-log-collector-config-v1, key: device-tenant-map.json}}}
        resources:
          requests: {cpu: 250m, memory: 256Mi}
          limits: {cpu: "2", memory: 1Gi}
        readinessProbe:
          tcpSocket: {port: vector-api}
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          tcpSocket: {port: vector-api}
          initialDelaySeconds: 20
          periodSeconds: 20
        volumeMounts:
        - {name: vector-config, mountPath: /etc/vector/vector.yaml, subPath: vector.yaml, readOnly: true}
        - {name: protobuf-descriptor, mountPath: /etc/vector/descriptor/device-log.desc, subPath: device-log.desc, readOnly: true}
        - {name: kafka-client-tls, mountPath: /etc/kafka/tls, readOnly: true}
        - {name: collector-data, mountPath: /var/lib/vector}
        - {name: tmp, mountPath: /tmp}
      volumes:
      - name: vector-config
        configMap: {name: device-log-collector-config-v1}
      - name: protobuf-descriptor
        configMap: {name: device-log-collector-config-v1}
      - name: kafka-client-tls
        secret: {secretName: kafka-client-tls, optional: false}
      - name: tmp
        emptyDir: {}
      nodeSelector:
        kubernetes.io/arch: amd64
  volumeClaimTemplates:
  - metadata:
      name: collector-data
      labels:
        app.kubernetes.io/name: device-log-collector
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 10Gi
