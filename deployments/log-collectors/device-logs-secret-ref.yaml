apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kafka-device-log-collector-credentials
  namespace: traffic-analysis
  labels:
    app.kubernetes.io/name: device-log-collector
    traffic.analysis/rollout-state: default-off
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: traffic-platform-secret-store
    kind: ClusterSecretStore
  target:
    name: kafka-device-log-collector-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        username: "traffic-device-log-collector"
        password: "{{ .password }}"
  data:
  - secretKey: password
    remoteRef:
      key: traffic-platform-prod-credentials
      property: KAFKA_DEVICE_LOG_COLLECTOR_PASSWORD
