apiVersion: v1
kind: Service
metadata:
  name: forensics-service
  namespace: traffic-analysis
spec:
  selector:
    app: forensics-service
  ports:
    - name: http
      port: 8086
      targetPort: 8086
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: forensics-service
  namespace: traffic-analysis
spec:
  replicas: 2
  selector:
    matchLabels:
      app: forensics-service
  template:
    metadata:
      labels:
        app: forensics-service
    spec:
      containers:
      - name: forensics-service
        image: registry.example.com/traffic/forensics-service:latest
        ports:
        - containerPort: 8086
        env:
        - name: CLICKHOUSE_DSN
          value: "clickhouse://clickhouse:9000/traffic"
        - name: S3_ENDPOINT
          value: "minio.minio.svc:9000"
        - name: S3_BUCKET
          value: "pcap-archive"
        - name: S3_RESULT_BUCKET
          value: "pcap-archive"
        - name: S3_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: minio-forensics-service-credentials
              key: accesskey
        - name: S3_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: minio-forensics-service-credentials
              key: secretkey
        - name: S3_USE_SSL
          value: "false"
        - name: MAX_CONCURRENT
          value: "5"
        - name: FORENSICS_PIPELINE_V1_ENABLED
          value: "false"
        - name: FORENSICS_WORKER_COMPATIBLE_READY
          value: "false"
        - name: FORENSICS_WORKER_ENABLED
          value: "false"
        - name: FORENSICS_WORKER_ID
          valueFrom:
            fieldRef:
              fieldPath: metadata.uid
        - name: FORENSICS_WORKER_EXECUTION_LEASE
          value: "31m"
        - name: FORENSICS_SOURCE_RETENTION
          value: "2160h"
        - name: API_LISTEN_ADDR
          value: ":8086"
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "2000m"
