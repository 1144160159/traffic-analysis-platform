apiVersion: v1
kind: Service
metadata:
  name: asset-service
  namespace: traffic-analysis
  labels:
    app: asset-service
spec:
  type: ClusterIP
  selector:
    app: asset-service
  ports:
    - name: grpc
      port: 50053
      targetPort: 50053
    - name: http
      port: 8083
      targetPort: 8083
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: asset-service
  namespace: traffic-analysis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: asset-service
  template:
    metadata:
      labels:
        app: asset-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8083"
    spec:
      containers:
      - name: asset-service
        image: traffic/asset-service:remediation-asset-risk-v1-20260731
        imagePullPolicy: Never
        ports:
        - containerPort: 50053
          name: grpc
        - containerPort: 8083
          name: http
        env:
        - name: ASSET_GRPC_PORT
          value: "50053"
        - name: ASSET_HTTP_PORT
          value: "8083"
        - name: ASSET_PG_HOST
          value: "postgres-primary.databases.svc"
        - name: ASSET_PG_PORT
          value: "5432"
        - name: ASSET_PG_USER
          value: "postgres"
        - name: ASSET_PG_PASSWORD
          valueFrom:
            secretKeyRef:
              name: traffic-credentials
              key: PG_PASSWORD
        - name: ASSET_PG_DB
          value: "traffic_platform"
        - name: ASSET_PG_SSLMODE
          value: "disable"
        - name: ASSET_KAFKA_ENABLED
          value: "true"
        - name: ASSET_KAFKA_BROKERS
          value: "kafka-bootstrap.middleware.svc:9092"
        - name: ASSET_KAFKA_TOPIC
          value: "asset.bindings.v1"
        - name: ASSET_KAFKA_GROUP_ID
          value: "asset-service-bindings"
        - name: ASSET_EVENT_OUTBOX_ENABLED
          value: "false"
        - name: ASSET_EVENT_TOPIC
          value: "asset.events.v2"
        - name: ASSET_DISCOVERY_OUTBOX_ENABLED
          value: "false"
        - name: ASSET_DISCOVERY_EVENT_TOPIC
          value: "asset.discovery.events.v1"
        - name: ASSET_CURSOR_V2_ENABLED
          value: "false"
        - name: ASSET_DETAIL_SNAPSHOT_V1_ENABLED
          value: "false"
        - name: ASSET_DETAIL_CLICKHOUSE_ENABLED
          value: "false"
        - name: CLICKHOUSE_HOSTS
          value: "clickhouse-1.middleware.svc:9000,clickhouse-2.middleware.svc:9000"
        - name: CLICKHOUSE_DATABASE
          value: "traffic"
        - name: CLICKHOUSE_USERNAME
          value: "default"
        - name: CLICKHOUSE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: traffic-credentials
              key: CLICKHOUSE_PASSWORD
        - name: ASSET_DETAIL_CLICKHOUSE_QUERY_TIMEOUT
          value: "3s"
        - name: ASSET_DETAIL_CLICKHOUSE_LOOKBACK
          value: "168h"
        - name: ASSET_DETAIL_CLICKHOUSE_ALERT_LIMIT
          value: "50"
        - name: ASSET_DETAIL_NEBULA_ENABLED
          value: "false"
        - name: ASSET_DETAIL_NEBULA_RELATION_LIMIT
          value: "100"
        - name: ASSET_DETAIL_EVIDENCE_ENABLED
          value: "false"
        - name: ASSET_DETAIL_EVIDENCE_LIMIT
          value: "100"
        - name: ASSET_GOVERNANCE_V1_ENABLED
          value: "false"
        - name: ASSET_PROJECTION_ENABLED
          value: "false"
        - name: ASSET_PROJECTION_GROUP_ID
          value: "asset-projection-v2"
        - name: ASSET_PROJECTION_OS_ADDRESSES
          value: "http://opensearch.middleware.svc:9200"
        - name: ASSET_PROJECTION_OS_USERNAME
          value: "admin"
        - name: ASSET_PROJECTION_OS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: traffic-credentials
              key: OPENSEARCH_ADMIN_PASSWORD
        - name: ASSET_PROJECTION_OS_WRITE_ALIAS
          value: "assets-v2-write"
        - name: ASSET_PROJECTION_NEBULA_ADDRESSES
          value: "nebula-graph.middleware.svc:9669"
        - name: ASSET_PROJECTION_NEBULA_USERNAME
          value: "traffic_graph"
        - name: ASSET_PROJECTION_NEBULA_PASSWORD
          valueFrom:
            secretKeyRef:
              name: traffic-credentials
              key: NEBULA_SERVICE_PASSWORD
        - name: ASSET_PROJECTION_NEBULA_SPACE
          value: "traffic_graph"
        - name: ASSET_EXPORT_JOBS_V1_ENABLED
          value: "false"
        - name: ASSET_EXPORT_WORKER_ENABLED
          value: "false"
        - name: ASSET_EXPORT_MAX_ROWS
          value: "100000"
        - name: ASSET_EXPORT_MAX_BYTES
          value: "104857600"
        - name: ASSET_EXPORT_RETENTION
          value: "168h"
        - name: ASSET_EXPORT_BUCKET
          value: "report-artifacts"
        - name: ASSET_EXPORT_OUTBOX_ENABLED
          value: "false"
        - name: ASSET_EXPORT_EVENT_TOPIC
          value: "asset.exports.v1"
        - name: S3_ENDPOINT
          value: "minio.minio.svc:9000"
        - name: S3_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: minio-asset-service-credentials
              key: accesskey
        - name: S3_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: minio-asset-service-credentials
              key: secretkey
        - name: S3_USE_SSL
          value: "false"
        - name: LOG_LEVEL
          value: "info"
        - name: SERVICE_VERSION
          value: "1.0.0"
        - name: ENVIRONMENT
          value: "production"
        livenessProbe:
          httpGet:
            path: /health
            port: 8083
          initialDelaySeconds: 10
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /health/readiness
            port: 8083
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
