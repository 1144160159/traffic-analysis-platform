apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: weekly-model-training
  namespace: argo
  labels:
    app: mlops-training
    schedule: weekly
spec:
  # 2026-08-16 代码审查整改（H39）：旧版 cron 直接运行 ConfigMap 内嵌的 legacy
  # 脚本（运行时 pip install、SQL 拼接、假注册），已全部删除。本 cron 改为引用
  # 治理模板 mlops-governed-training-template。
  #
  # 注意：治理模板要求事前冻结不可变数据窗口（dataset-window-from/through 等）。
  # 在窗口参数自动生成机制（按 scheduledTime 计算窗口）落地前，本 cron 保持
  # suspend=true，由操作员以显式冻结窗口按需提交治理训练
  # （argo submit --from workflowtemplate/mlops-governed-training-template）。
  # 重新启用前必须确认 window 参数能按调度语义正确填充，禁止回到无窗口的旧链。
  suspend: true

  # 每周日凌晨 2:00 执行（Asia/Shanghai）
  schedule: "0 2 * * 0"
  timezone: "Asia/Shanghai"

  # 并发策略：不允许并发执行
  concurrencyPolicy: "Forbid"

  # 保留历史记录
  successfulJobsHistoryLimit: 5
  failedJobsHistoryLimit: 3

  # 启动延迟
  startingDeadlineSeconds: 600

  workflowSpec:
    workflowTemplateRef:
      name: mlops-governed-training-template

    serviceAccountName: argo-workflow

    podGC:
      strategy: OnPodCompletion

    arguments:
      parameters:
      # 镜像（必须由发布链路注入 digest）
      - name: trainer-image
        value: traffic/mlops-trainer:remediation-20260731
      - name: trainer-image-digest
        value: ""
      # 数据窗口与身份（窗口参数落地前为空，见文件头注释）
      - name: tenant-id
        value: ""
      - name: feature-set-id
        value: "v1"
      - name: dataset-window-from
        value: ""
      - name: dataset-window-through
        value: ""
      - name: dataset-source-watermark
        value: ""
      - name: dataset-as-of
        value: ""
      - name: dataset-train-through
        value: ""
      - name: dataset-validation-through
        value: ""
      - name: label-schema-version
        value: "1"
      - name: label-revision-sha256
        value: ""
      - name: open-set-attack-families
        value: ""
      - name: isolation-scope-key
        value: ""
      - name: graph-snapshot-manifest-key
        value: ""
      - name: graph-nodes-key
        value: ""
      - name: graph-edges-key
        value: ""
      - name: gnn-training-run-id
        value: ""
      - name: gnn-source-ablation-kinds
        value: ""
      - name: model-id
        value: ""
      - name: model-version
        value: ""
      - name: model-signing-secret-name
        value: ""
      - name: model-signing-key-id
        value: ""
      - name: model-registration-idempotency-key
        value: ""
