apiVersion: v1
kind: ConfigMap
metadata:
  name: mlops-scripts
  namespace: traffic-analysis
  labels:
    app: mlops-training
data:
  # 说明（2026-08-16 代码审查整改）：
  # 本 ConfigMap 不再内嵌训练脚本。旧版 extract_data.py / train_model.py /
  # evaluate_model.py / register_model.py 已删除：它们与 mlops/scripts/ 漂移、
  # 含未转义 SQL 拼接与"假注册"实现，且定时任务直接运行这些副本导致血缘不可
  # 追溯。所有脚本统一由 trainer 镜像 /app/scripts/ 提供（见 mlops/Dockerfile
  # 与 mlops-governed-training-template.yaml）。requirements.txt 仅作依赖清单
  # 参考，真实构建以 mlops/requirements.txt 为准。
  requirements.txt: |
    # NOTE: 依赖清单仅供参考，镜像构建使用 mlops/requirements.txt。
    # Core ML Libraries
    xgboost==2.0.3
    lightgbm==4.3.0
    scikit-learn==1.4.0
    pandas==2.2.0
    numpy==1.26.3

    # Data Processing
    pyarrow==15.0.0
    fastparquet==2024.2.0

    # Database Connectors
    clickhouse-driver==0.2.7

    # Object Storage
    minio==7.2.3

    # HTTP Clients
    requests==2.31.0
