apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: traffic-governed-training-
  namespace: argo
  labels:
    app: mlops-training
    workflows.argoproj.io/archive-strategy: "true"
spec:
  # 2026-08-16 代码审查整改（H39）：本文件从内嵌 legacy 脚本（python:3.11-slim
  # + 运行时 pip install + ConfigMap 挂载）改为引用治理模板
  # mlops-governed-training-template。全部训练/评估/门禁/导出/注册逻辑由镜像内
  # /app/scripts/ 提供，血缘与质量门禁统一。
  workflowTemplateRef:
    name: mlops-governed-training-template

  serviceAccountName: argo-workflow

  podGC:
    strategy: OnPodCompletion

  arguments:
    parameters:
    # 镜像（必须由发布链路注入 digest，禁止 mutable tag 直跑）
    - name: trainer-image
      value: traffic/mlops-trainer:remediation-20260731
    - name: trainer-image-digest
      value: ""
    # 数据窗口与身份（由操作员在提交时冻结；空值在提取步骤 fail-closed）
    - name: tenant-id
      value: ""
    - name: feature-set-id
      value: "v1"
    - name: dataset-window-from
      value: ""
    - name: dataset-window-through
      value: ""
    - name: dataset-source-watermark
      value: ""
    - name: dataset-as-of
      value: ""
    - name: dataset-train-through
      value: ""
    - name: dataset-validation-through
      value: ""
    - name: label-schema-version
      value: "1"
    - name: label-revision-sha256
      value: ""
    - name: open-set-attack-families
      value: ""
    - name: isolation-scope-key
      value: ""
    - name: graph-snapshot-manifest-key
      value: ""
    - name: graph-nodes-key
      value: ""
    - name: graph-edges-key
      value: ""
    - name: gnn-training-run-id
      value: ""
    - name: gnn-source-ablation-kinds
      value: ""
    # 模型身份与注册（注册使用 rule-manager 的 metadata-only 接口，不激活）
    - name: model-id
      value: ""
    - name: model-version
      value: ""
    - name: model-signing-secret-name
      value: ""
    - name: model-signing-key-id
      value: ""
    - name: model-registration-idempotency-key
      value: ""
